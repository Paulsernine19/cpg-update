<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="brand/hmcas-mark.webp">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
<title>HMCAS CPG v2.6</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600&display=swap">
<style>
/* Layout: app shell — sidebar nav on desktop, bottom tab bar on phone; lessons open as a focused full-screen player */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --sunken:#EBEEF7; --ink:#131933; --muted:#5A6284; --line:#DFE3EF;
  --accent:#2F5BFF; --accent-soft:#E3E9FF; --on-accent:#FFFFFF;
  --sun:#B86E00; --sun-strong:#F29D0C; --sun-soft:#FFF1D6;
  --good:#16865A; --good-soft:#DDF5EA; --bad:#D03A43; --bad-soft:#FCE3E4;
  --ccp:#6A4BD6; --ccp-soft:#ECE6FF;
  --c-intro:#3B4466; --c-trauma:#D24A2C; --c-newborn:#2486CF; --c-cardiac:#B8336A; --c-stroke:#6A4BD6; --c-final:#16865A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1021; --surface:#161A30; --sunken:#1D2240; --ink:#E8EBF9; --muted:#9BA2C4; --line:#2A3054;
  --accent:#7090FF; --accent-soft:#232C5C; --on-accent:#0D1021;
  --sun:#FFC45A; --sun-strong:#FFBE45; --sun-soft:#3A2C12;
  --good:#3ACB8C; --good-soft:#123527; --bad:#FF6B73; --bad-soft:#3E1A1F;
  --ccp:#A893FF; --ccp-soft:#2A2350;
  --c-intro:#8D97C2; --c-trauma:#FF7A5C; --c-newborn:#5AB2F2; --c-cardiac:#F06A9C; --c-stroke:#A089FF; --c-final:#3ACB8C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1021; --surface:#161A30; --sunken:#1D2240; --ink:#E8EBF9; --muted:#9BA2C4; --line:#2A3054;
  --accent:#7090FF; --accent-soft:#232C5C; --on-accent:#0D1021;
  --sun:#FFC45A; --sun-strong:#FFBE45; --sun-soft:#3A2C12;
  --good:#3ACB8C; --good-soft:#123527; --bad:#FF6B73; --bad-soft:#3E1A1F;
  --ccp:#A893FF; --ccp-soft:#2A2350;
  --c-intro:#8D97C2; --c-trauma:#FF7A5C; --c-newborn:#5AB2F2; --c-cardiac:#F06A9C; --c-stroke:#A089FF; --c-final:#3ACB8C; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Shell */
.app{display:grid;min-height:100%}
.side{display:none}
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px;width:100%;max-width:780px;margin:0 auto;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.2rem;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.brand svg{width:30px;height:30px;flex:none}
.brand .bmark{width:34px;height:34px;flex:none;border-radius:10px;display:block}
.org{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 18px}
.org img{height:56px;width:auto;max-width:100%;display:block}
.org+.hello{margin-top:6px}
.org span{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4a5a70}
@media (max-width:560px){.org img{height:44px}}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.pills{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--sun-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--sun-strong) 45%,transparent);border-radius:14px;padding:10px 14px;font-size:.88rem;margin-bottom:20px}
.banner b{color:var(--sun)}
.banner svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--sun)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 10px;border-radius:12px;color:var(--muted);font-size:.78rem;font-weight:700}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){
  .app{grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{margin:0 10px 26px}
  .side .tab{flex-direction:row;gap:12px;padding:12px 14px;font-size:1rem;justify-content:flex-start}
  .side .tab[aria-current="page"]{background:var(--accent-soft)}
  .side .foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:0 10px}
  .tabs{display:none}
  .topbar .brand{visibility:hidden}
  .main{padding-block:32px 60px}
}

.section{display:grid;gap:14px;margin-top:30px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.section-head h2{font-size:1.3rem}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:0}
.hello h1{font-size:clamp(1.7rem,4.5vw,2.3rem)}
.hello p{margin:6px 0 0;color:var(--muted);max-width:60ch}

.resume{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:22px}
.resume .icon{width:86px;height:86px}
.resume h2{font-size:1.35rem;margin-top:4px}
.resume p{margin:4px 0 14px;color:var(--muted);font-size:.95rem}
@media (max-width:460px){.resume{grid-template-columns:1fr}.resume .icon{width:64px;height:64px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:1rem;background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s;text-decoration:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.good{background:var(--good);box-shadow:0 3px 0 color-mix(in srgb,var(--good) 60%,#000);color:#fff}
.btn.bad{background:var(--bad);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 60%,#000);color:#fff}
.btn[disabled]{background:var(--sunken);color:var(--muted);box-shadow:none;cursor:not-allowed;border:0}
.btn.wide{width:100%}
.btn.sm{padding:9px 14px;font-size:.9rem;border-radius:11px}

.icon{display:grid;place-items:center;border-radius:20px;color:#fff;flex:none}
.icon svg{width:58%;height:58%}
.bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good);transition:width .4s}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:700;font-size:.9rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.course{display:grid;gap:12px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;transition:transform .15s,border-color .15s}
.course:hover{transform:translateY(-3px);border-color:var(--muted)}
.course .icon{width:58px;height:58px;border-radius:16px}
.course h3{font-size:1.1rem}
.course p{margin:0;color:var(--muted);font-size:.88rem}
.course .meta{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.course.locked .icon{background:var(--sunken)!important;color:var(--muted)}
.lockline{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);font-weight:700}
.lockline svg{width:14px;height:14px}

.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-weight:700;padding:4px 0;margin-bottom:12px}
.hero{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px}
.hero .icon{width:72px;height:72px}
.hero h1{font-size:clamp(1.6rem,4vw,2.1rem)}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.hero .stats{display:flex;gap:20px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.hero .stats b{color:var(--ink)}
.coverage{font-size:.85rem;color:var(--muted)}
.coverage b{color:var(--ink)}

.path{display:grid;justify-items:center;gap:22px;padding:18px 0 10px}
.unit{justify-self:stretch;display:flex;align-items:center;gap:12px;margin-top:6px}
.unit::before,.unit::after{content:"";flex:1;height:1px;background:var(--line)}
.node{display:grid;justify-items:center;gap:8px;background:none;border:0;padding:0;width:160px;text-align:center}
.disc{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--hue);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--hue) 55%,#000);transition:transform .1s;position:relative}
.disc svg{width:34px;height:34px}
.node:hover .disc{transform:translateY(-2px)}
.node.locked .disc{background:var(--sunken);color:var(--muted);box-shadow:0 6px 0 var(--line)}
.node.locked{cursor:not-allowed}
.node.next .disc::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--hue);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.15)}}
.node .t{font-weight:700;font-size:.92rem;line-height:1.25}
.node.locked .t{color:var(--muted)}
.node .s{font-size:.75rem;color:var(--muted)}
@media (max-width:420px){.node{width:130px}}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:2px}
.tile b{font-family:var(--display);font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:.82rem;color:var(--muted);font-weight:700}
@media (max-width:420px){.tile{padding:12px}.tile b{font-size:1.45rem}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.day{display:grid;justify-items:center;gap:6px;font-size:.75rem;color:var(--muted);font-weight:700}
.day i{width:30px;height:30px;border-radius:50%;background:var(--sunken);display:grid;place-items:center}
.day.on i{background:var(--sun-strong);color:#fff}
.day.today{color:var(--ink)}
.day i svg{width:16px;height:16px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .icon{width:40px;height:40px;border-radius:12px}
.row .bar{margin-top:6px}
.row small{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.danger{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:.85rem;color:var(--muted);margin:0}
details.gloss{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
details.gloss summary{font-weight:700;cursor:pointer}
dl.terms{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:12px 0 0;font-size:.92rem}
dl.terms dt{font-weight:700}
dl.terms dd{margin:0;color:var(--muted)}

/* Player */
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto}
.p-top{display:flex;align-items:center;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));max-width:820px;width:100%;margin:0 auto}
.x{background:none;border:0;padding:6px;color:var(--muted);display:grid}
.x svg{width:26px;height:26px}
.p-top .bar{flex:1;height:12px}
.p-top .bar i{background:var(--accent)}
.p-top .count{font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.p-body{overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
.step{max-width:660px;margin:0 auto;display:grid;gap:16px;animation:in .3s ease}
@keyframes in{from{opacity:.3;transform:translateX(16px)}to{opacity:1;transform:none}}
.step h2{font-size:clamp(1.35rem,3.6vw,1.75rem)}
.step p{margin:0;font-size:1.05rem;max-width:64ch}
.step ul{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:1.02rem}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:999px;border:1px solid transparent}
.badge.ap{background:var(--good-soft);color:var(--good)}
.badge.ccp{background:var(--ccp-soft);color:var(--ccp)}
.badge.pend{background:var(--sun-soft);color:var(--sun)}
.badge.pop{background:var(--sunken);color:var(--ink)}
.badge.crit{background:var(--bad-soft);color:var(--bad)}
.src{font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.pending{border:1.5px dashed color-mix(in srgb,var(--sun-strong) 70%,transparent);background:var(--sun-soft);border-radius:14px;padding:12px 14px;font-size:.95rem;display:grid;gap:6px}
.pending b{color:var(--sun)}
.pending ul{font-size:.95rem}
.visual{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;overflow-x:auto}
.visual svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:1rem;box-shadow:0 3px 0 var(--line)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.opt .k svg{width:16px;height:16px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.opt[aria-checked="true"] .k{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.opt[disabled]{cursor:default}
.ans{display:flex;align-items:center;gap:10px}
.ans input{font:inherit;font-size:1.4rem;font-weight:700;width:9ch;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.ans input:focus{border-color:var(--accent);outline:none}
.ans span{color:var(--muted);font-weight:700}
.sort{display:grid;gap:10px}
.srow{display:grid;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.srow .ct{font-weight:700}
.srow.right{border-color:var(--good);background:var(--good-soft)}
.srow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.bins{display:flex;gap:8px;flex-wrap:wrap}
.bin{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;font-size:.88rem;font-weight:700;color:var(--muted)}
.bin[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.bin[disabled]{cursor:default}
.lookup{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.lookup svg{width:34px;height:34px;color:var(--accent);flex:none}
.lookup b{display:block}
.watch{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tog{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-weight:700}
.tog i{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center}
.tog[aria-pressed="true"]{border-color:var(--good)}
.tog[aria-pressed="true"] i{background:var(--good);border-color:var(--good);color:#fff}
.tog i svg{width:14px;height:14px}

.tree{display:grid;gap:8px;min-width:0}
.ustep{list-style:none;padding:0;margin:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ustep li{border-radius:14px;background:var(--sunken);padding:12px;display:grid;gap:2px}
.ustep li b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem;line-height:1;color:var(--c-trauma)}
.ustep li span{font-weight:700}
.ustep li small{color:var(--muted);font-size:.88rem;line-height:1.35}
.txc.race td small{color:var(--muted)}
.txc.race{min-width:0;font-size:.82rem}.txc.race th,.txc.race td{padding:6px 6px;vertical-align:top}
.tree .root{font-weight:700;text-align:center;padding:10px;border-radius:12px;background:var(--accent-soft)}
.branch{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px;align-items:stretch}
.branch>div{border-radius:12px;padding:10px 12px;font-size:.92rem;border:1px solid var(--line)}
.branch .if{background:var(--bg);font-weight:700}
.branch .p1{background:var(--good-soft);border-color:transparent}
.branch .p2{background:var(--sunken);border-color:transparent}
.branch .pd{background:var(--sun-soft);border:1.5px dashed color-mix(in srgb,var(--sun-strong) 70%,transparent)}
.ways{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ways>div{border-radius:14px;padding:12px;border:1px solid var(--line);display:grid;gap:4px;align-content:start}
.ways b{font-family:var(--display)}
.ways small{color:var(--muted)}
@media (max-width:460px){.ways{grid-template-columns:1fr}.branch{grid-template-columns:1fr}}

.p-foot{border-top:1px solid var(--line);background:var(--surface);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.p-foot.right{background:var(--good-soft);border-color:transparent}
.p-foot.wrong{background:var(--bad-soft);border-color:transparent}
.foot-in{max-width:660px;margin:0 auto;display:grid;gap:12px}
.fb{display:grid;gap:4px;max-height:34vh;overflow-y:auto}
.fb h3{font-size:1.15rem;display:flex;align-items:center;gap:8px}
.p-foot.right h3{color:var(--good)} .p-foot.wrong h3{color:var(--bad)}
.fb p{margin:0;font-size:.95rem}
.fb .src{border-top:0;padding-top:0}
.foot-btns{display:flex;gap:10px;flex-wrap:wrap}
.foot-btns .btn{flex:1;min-width:140px}

.done{max-width:560px;margin:0 auto;display:grid;justify-items:center;text-align:center;gap:16px;padding-top:4vh;animation:in .4s ease}
.burst{width:110px;height:110px;border-radius:50%;background:var(--good);display:grid;place-items:center;color:#fff;box-shadow:0 8px 0 color-mix(in srgb,var(--good) 55%,#000)}
.burst.amber{background:var(--sun-strong);box-shadow:0 8px 0 color-mix(in srgb,var(--sun-strong) 55%,#000)}
.burst svg{width:56px;height:56px}
.done .tiles{width:100%}
.res{width:100%;text-align:left;display:grid;gap:10px}
.resrow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.resrow .bar{grid-column:1/-1}
.resrow small{font-weight:700;font-variant-numeric:tabular-nums}
.resrow .ok{color:var(--good)} .resrow .no{color:var(--bad)}
.revisit{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1}

/* Quick actions */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.qbtn{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}

.qbtn b{display:block}
.qbtn small{color:var(--muted);font-size:.84rem}
/* Confidence */
.conf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.conf .label{margin-right:4px}
.cbtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:700;color:var(--muted)}
.cbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cnote{margin:4px 0 0!important;font-size:.9rem!important;font-weight:700}
.cnote.bad{color:var(--bad)}
.cnote.mid{color:var(--sun)}
/* Interactive algorithm */
.case{background:var(--sunken);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.case p{font-size:1rem!important}
.trail{display:grid;gap:6px}
.crumb{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);flex-wrap:wrap}
.crumb svg{width:16px;height:16px;color:var(--good);flex:none}
.crumb b{color:var(--ink);background:var(--good-soft);padding:2px 8px;border-radius:6px}
.wq{display:grid;gap:12px;background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:16px}
.wq h3{font-size:1.15rem}
.wopts{display:grid;gap:8px}
.why{background:var(--bad-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.95rem}
.why b{color:var(--bad)}
.wend{border-radius:18px;padding:16px;display:grid;gap:4px;font-size:1.05rem}
.wend.p1{background:var(--good-soft)} .wend.p2{background:var(--sunken)} .wend.pd{background:var(--sun-soft);border:1.5px dashed color-mix(in srgb,var(--sun-strong) 70%,transparent)}
/* Flip cards */
.deck{max-width:560px;margin:0 auto;display:grid;gap:14px;justify-items:center;padding-top:2vh}
.card3d{width:100%;perspective:1400px}
.inner{display:grid;width:100%;padding:0;border:0;background:none;text-align:left;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card3d.flipped .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:26px 24px;display:grid;align-content:center;gap:14px;min-height:300px;border:1px solid var(--line);box-shadow:0 6px 0 var(--line)}
.face.front{background:var(--surface)}
.face.back{background:var(--accent-soft);transform:rotateY(180deg);border-color:transparent;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 35%,transparent)}
.ftxt{font-family:var(--display);font-weight:600;font-size:clamp(1.2rem,3.6vw,1.5rem);line-height:1.3;margin:0}
.kind{justify-self:start;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.kind.habit{background:var(--bad-soft);color:var(--bad)} .kind.removed{background:var(--sunken);color:var(--ink)} .kind.new{background:var(--good-soft);color:var(--good)} .kind.now{background:var(--accent);color:var(--on-accent)}
.face .src{border:0;padding:0}
/* Reference */
.refrows{display:grid;gap:10px}
.refrow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.refrow p{margin:0}
.refrow .src{border:0;padding:0}
.confgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
/* TXA chart */
.txc{border-collapse:collapse;width:100%;min-width:480px;font-size:.88rem;font-variant-numeric:tabular-nums}
.txc th,.txc td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}
.txc th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.txc td:first-child{font-weight:700}
.txc tr.band td{background:var(--sun-soft);font-size:.84rem;font-weight:400}
.txc .out{color:var(--bad);font-weight:700}
/* Simulation */
.simcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.simcard .icon{width:64px;height:64px;border-radius:18px}

.simstat.ok{color:var(--good)} .simstat.no{color:var(--muted)}
.modes{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.modes li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:1rem}
.modes b.n{width:26px;height:26px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-size:.8rem}
.simalt{display:grid;gap:8px;font-size:.9rem;color:var(--muted)}
.simalt a{color:var(--accent);font-weight:700}
.simwrap{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;grid-template-rows:auto auto 1fr}
.simbar{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.simbar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.simdone{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--good-soft);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));font-weight:700;color:var(--good)}
.simdone svg{width:18px;height:18px}
.simwrap iframe{width:100%;height:100%;border:0;background:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (max-width:420px){.simcard{grid-template-columns:1fr}}
/* ===== Immersive scene (TXA hands-on): deliberate dark ambulance-interior palette ===== */
.player.scene{--glass:rgba(20,40,90,.05);--saline:rgba(70,130,230,.32);--txa:rgba(80,140,225,.42);--plunger:#9EA9C9;--photo:#FFFFFF;--mon:#04070E;--live:var(--good);background:radial-gradient(120% 55% at 50% 0%,var(--accent-soft) 0%,var(--bg) 58%)}

.casegrid{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:.95rem}

 {id:"Q1",mod:"trauma",lesson:"tr-1",scope:"AP",prompt:"An alert collision patient has neck pain, follows instructions, can stand and has no neurological deficit. Which approach should be considered first?",

 {id:"Q11",mod:"cardiac",lesson:"ca-3",scope:"AP",prompt:"For a paediatric arrest patient weighing under 25 kg, which pad position is the first choice?",
  options:["Anterior-posterior","Anterior-lateral is always mandatory","Pad position does not matter"],answer:0,
  explain:"Anterior-posterior is first choice under 25 kg. Over 25 kg, either anterior-lateral or anterior-posterior may be used.",src:"CPG 2.3 p.42"},
 {id:"Q12",mod:"cardiac",lesson:"ca-4",scope:"AP",prompt:"Which SpO₂ target applies after ROSC?",
  options:["94–98%","Any value above 90% without an upper target","100% for all patients throughout transport"],answer:0,
  explain:"94–98%. Avoid hyperoxaemia (SpO₂ at 100% for prolonged periods).",src:"CPG 2.6 p.54"},
 {id:"Q13",mod:"cardiac",lesson:"ca-5",scope:"AP",prompt:"How does ventilation start in a drowning cardiac arrest?",
  options:["Five ventilations with a BVM and 100% oxygen","No ventilations until hospital arrival","Compressions only for the first two minutes"],answer:0,
  explain:"Five ventilations with a BVM and 100% oxygen, then standard arrest management. Consider hypothermia, spinal injury and e-CPR criteria.",src:"CPG 2.8 p.58"},
 {id:"Q14",mod:"cardiac",lesson:"ca-6",scope:"CCP",prompt:"An adult with a regular narrow-complex tachycardia is in life-threatening compromise. The CCP prepares to cardiovert. Which first energy does v2.6 give?",
  options:["120 J","150 J","200 J"],answer:0,
  explain:"Narrow-complex adult: regular 120 J, irregular 200 J, with stepwise escalation. 150 J is for broad-complex. Synchronised cardioversion is CCP scope: the AP recognises the unstable tachycardia, applies pads and requests a CCP.",src:"CPG 4.4 p.79 · CPG 4.3 p.77"},
 {id:"Q15",mod:"cardiac",lesson:"ca-6",scope:"CCP",prompt:"A CCP gave ondansetron and wants to sign the patient off to you for transport. Which condition set is correct?",
  options:["Any patient may be signed off after any antiemetic","The patient is stable, has no adverse effects, and has had no other CCP medications that aren't approved for AP sign-off","Sign-off is only allowed if the patient is asleep"],answer:1,
  explain:"All three conditions must be met: stable, no adverse effects, and no other CCP medications not approved for sign-off to APs.",src:"CPG 6.4 · ondansetron formulary"},
 {id:"Q16",mod:"stroke",lesson:"st-3",scope:"AP",prompt:"A BEFAST-positive patient was last known well 10 hours ago and has RACE 6. Where do they go?",
  options:["P1 to HGH ED with prenotification via CC:E","P2 to nearest appropriate ED","No transport"],answer:0,
  explain:"More than 8 and less than 24 hours with RACE ≥5: P1 to HGH ED with prenotification via CC:E.",src:"CPG 3.1 p.64"},
 {id:"Q17",mod:"stroke",lesson:"st-3",scope:"AP",prompt:"A BEFAST-positive patient has a wake-up stroke with unknown onset. Where do they go?",
  options:["P2 because the exact time is unavailable","P1 to HGH ED with prenotification via CC:E","Use the removed 15-hour threshold"],answer:1,
  explain:"Wake-up or unknown onset is treated as an acute stroke: P1 to HGH ED with prenotification via CC:E.",src:"CPG 3.1 p.64"},
 {id:"Q18",mod:"stroke",lesson:"st-3",scope:"AP",prompt:"Last known well was exactly 8 hours ago. Which branch applies?",
  options:["The ≤8-hour branch: P1 to HGH ED with prenotification","The >8 to <24-hour RACE branch","The ≥24-hour branch"],answer:0,
  explain:"Exactly 8 hours falls in the ≤8-hour branch.",src:"CPG 3.1 p.64"},
 {id:"Q19",mod:"stroke",lesson:"st-3",scope:"AP",prompt:"Last known well was exactly 24 hours ago. Which branch applies?",
  options:["P1 because RACE is high","P2 to the nearest appropriate ED","The old 15-hour branch"],answer:1,
  explain:"24 hours falls in the ≥24-hour branch: P2 to the nearest appropriate ED. RACE is not used here.",src:"CPG 3.1 p.64"},
 {id:"Q20",mod:"stroke",lesson:"st-4",scope:"AP",prompt:"Which handover set matches the stroke prenotification checklist?",
  options:["Age and ETA only","Age, last seen well, BEFAST, RACE if done, RBS, BP, anticoagulant status and ETA","RACE alone"],answer:1,
  explain:"Age, last seen well, BEFAST, RACE if done, RBS, BP, anticoagulant status and ETA.",src:"CPG 3.1 p.62"},
 {id:"Q21",mod:"trauma",lesson:"tr-1",scope:"AP",prompt:"A trapped driver can't move or feel their legs. Which extrication approach applies?",
  options:["Self-extrication with verbal guidance","Rapid extrication with gentle handling","Wait for full monitoring before any movement"],answer:1,
  explain:"Hard neurological signs (loss of motor and sensory function) mean rapid extrication with gentle handling. Soft signs such as non-dermatomal tingling don't rule out self-extrication.",src:"CPG 10.13 p.200"},
 {id:"Q22",mod:"newborn",lesson:"nb-4",scope:"AP",prompt:"After 30 seconds of effective BVM ventilation, the newborn's heart rate is 50/min. What next?",
  options:["Continue ventilation only and recheck in 2 minutes","Start compressions at 3:1 using the two-thumb technique and increase oxygen to 100%","Give glucagon"],answer:1,
  explain:"HR still <60 after 30 seconds of ventilation: start compressions at 3:1 with the two-thumb technique, 100% oxygen, and reassess HR and breathing every 30 seconds.",src:"CPG 2.5 p.52"},
 {id:"Q23",mod:"cardiac",lesson:"ca-2",scope:"AP",prompt:"Adult traumatic cardiac arrest. When is adrenaline first given?",
  options:["As soon as IV access is in","After reversible causes are managed and at least 500 ml normal saline has been given","After the third shock"],answer:1,
  explain:"Trauma arrest: no adrenaline until reversible causes are managed and at least 500 ml NS is in. Then every 4 minutes.",src:"CPG 2.2 p.35"},
 {id:"Q24",mod:"stroke",lesson:"st-3",scope:"AP",prompt:"BEFAST positive, last known well 12 hours ago, RACE 3. Where do they go?",
  options:["P1 to HGH ED","P2 to the nearest appropriate ED","No transport needed"],answer:1,
  explain:">8 and <24 hours with RACE <5: P2 to the nearest appropriate ED.",src:"CPG 3.1 p.64"}
];

  {t:"<b>Neurogenic shock MAP:</b> isolated 85–90 mmHg; with haemorrhagic shock ≥65 mmHg. Avoid hypotension; fluids judiciously.",scope:"AP",src:"CPG 10.3 p.178"},
  {t:"<b>Neurogenic shock treatment:</b> noradrenaline is preferred (adults); add adrenaline infusion if bradycardia and hypotension persist. Early intubation for C1–4 injury with airway/breathing compromise.",scope:"CCP",src:"CPG 10.3 pp.177–178"},
  {t:"<b>SMR:</b> consider removing the combi-carrier on the stretcher (keep for unconscious); head blocks always; stretcher up to 30° if lying flat causes distress; remove a rigid collar if causing distress.",scope:"AP",src:"CPG 10.3 p.178"}]},
 newborn:{visual:"ways",items:[
  {t:"<b>Normal ranges:</b> RR 40–60 · HR 100–160 · temperature 36–37.5 °C · flexed tone · centrally pink mucous membranes.",scope:"AP",src:"CPG 12.13 pp.246–247"},
  {t:"<b>Thermal care (mandatory):</b> warm room/ambulance, doors closed, AC off or lowest · dry thoroughly, especially the head · warm hat · wrap in blankets/thermal foil · keep ≥36.5 °C. Preterm &lt;37 weeks: thermal mattress and plastic bag wrap too.",scope:"AP",src:"CPG 12.13 p.247"},
  {t:"<b>Temperature checks:</b> soon after birth, during transport and on arrival; record in the ePCR.",scope:"AP",src:"CPG 12.13 p.248"},
  {t:"<b>Cord:</b> intact ≥60 s, then clamp ~5 cm from the umbilicus. Don't delay if resuscitation is needed.",scope:"AP",src:"CPG 12.13 p.247"},
  {t:"<b>Glucose:</b> routine care RBS &lt;2.6 mmol/L → pea-sized buccal glucose, repeat as required; no glucagon. Resuscitation → dextrose 10% 2 ml/kg.",scope:"AP",src:"CPG 12.13 p.249 · CPG 2.5 p.52"},
  {t:"<b>&lt;20 weeks:</b> not viable; resuscitation not required. False signs of life are possible. If in doubt, resuscitate.",scope:"AP",src:"CPG 12.13 p.247"},
  {t:"<b>Airway:</b> neutral head position; jaw thrust preferred; suction only for obstruction under direct vision (mouth then nose).",scope:"AP",src:"CPG 2.5 p.51"},
  {t:"<b>Breaths:</b> 5 inflation breaths of 2–3 s, ideally within 60 s, with PEEP 6 cmH₂O. ≥32 weeks room air; &lt;32 weeks 30% oxygen.",scope:"AP",src:"CPG 2.5 p.51"},
  {t:"<b>Compressions:</b> HR &lt;60 after 30 s of ventilation → 3:1, two-thumb, 100% oxygen; reassess HR and breathing every 30 s.",scope:"AP",src:"CPG 2.5 p.52"},
  {t:"<b>Targets:</b> SpO₂ &gt;80% and HR &gt;100 by 5 minutes; temperature 36.5–37.5 °C. Fluids NS 10 ml/kg (repeat once). Defib 4 J/kg, pads anterior-posterior.",scope:"AP",src:"CPG 2.5 p.52"}]},
 cardiac:{visual:"timeline",items:[
  {t:"<b>Adult medical shockable:</b> adrenaline after the 3rd shock, then every 4 minutes. Amiodarone 300 mg after the 3rd, 150 mg after the 5th. Non-shockable: adrenaline as soon as IV/IO is in.",scope:"AP",src:"CPG 2.1 · Summary p.1"},
  {t:"<b>Adult energy:</b> LP15 200, 300, 360 J · Zoll 150, 200, 200 J. Maximum 3 DSEDs, then standard anterior-posterior pads at maximum joules.",scope:"AP",src:"CPG 2.1 p.37 · Summary p.1"},
  {t:"<b>Adult CPR:</b> 100–120/min, 5–6 cm, pauses &lt;5 s; waveform capnography with any advanced airway, aim EtCO₂ ≈25 mmHg; gastric tube via SGA (APs and CCPs).",scope:"AP",src:"CPG 2.1–2.2 · Summary p.1"},
  {t:"<b>Adult trauma arrest:</b> HOTT first, minimum scene time. Adrenaline only after reversible causes and ≥500 ml NS, then every 4 minutes.",scope:"AP",src:"CPG 2.2 p.35"},
  {t:"<b>Paediatric arrest:</b> 5 ventilations, then 15:2. Adrenaline 0.01 mg/kg (max 1 mg): non-shockable ASAP; shockable after 4 min of CPR; every 4 min. Amiodarone 5 mg/kg after the 3rd (max 300 mg) and 5th (max 150 mg) shock. 4 J/kg.",scope:"AP",src:"CPG 2.3 pp.42–43"},
  {t:"<b>Paediatric details:</b> AP pads first choice &lt;25 kg · two-thumb for infants &lt;1 year · fluids 10 ml/kg × 3 · D10 2 ml/kg · ventilation &lt;1 y 25, 1–8 y 20, 8–12 y 15, &gt;12 y 10 per min. Trauma: adrenaline only after reversible causes and a 10 ml/kg NS bolus.",scope:"AP",src:"CPG 2.3–2.4 pp.43–47"},
  {t:"<b>Paediatric CCP:</b> energy escalation after 5 shocks in 2 J steps to max 8 J/kg; ETI may be considered after ~10 min; needle decompression (trauma) CCP only.",scope:"CCP",src:"CPG 2.3–2.4 · Summary p.2"},
  {t:"<b>Post-ROSC:</b> SpO₂ 94–98%, avoid hyperoxaemia. Adult SBP &gt;90 / MAP &gt;65. Comatose adult after medical arrest: ice packs to axillae and groin, not below 33 °C, tell the hospital.",scope:"AP",src:"CPG 2.6 pp.54–55"},
  {t:"<b>Special circumstances:</b> hypothermia: transport all without undeniable death; no adrenaline &lt;30 °C, every 6–10 min at 30–35 °C. Hyperthermia: cool to &lt;39 °C. Drowning: 5 BVM ventilations with 100% O₂. Dialysis: stop, return blood volume, disconnect before defib.",scope:"AP",src:"CPG 2.8 pp.58–59"},
  {t:"<b>Synchronised cardioversion (CCP only):</b> adult broad-complex 150 J; narrow-complex regular 120 J, irregular 200 J; escalate stepwise. Paediatric 1–2 J/kg, max 4 J/kg. AP: 12-lead, pads on, request CCP early.",scope:"CCP",src:"CPG 4.3–4.4 pp.77, 79"},
  {t:"<b>Antiemetic sign-off:</b> CCP may sign off to APs only if the patient is stable, has no adverse effects, and had no other CCP medications not approved for sign-off.",scope:"CCP",src:"CPG 6.4 · ondansetron formulary"}]},
 stroke:{visual:"tree",items:[
  {t:"<b>15-hour threshold:</b> removed.",scope:"AP",src:"CPG 3.1 p.64"},
  {t:"<b>RACE:</b> only for BEFAST-positive patients last known well &gt;8 and &lt;24 hours. Score 0–9; ≥5 suggests LVO.",scope:"AP",src:"CPG 3.1 pp.63–64"},
  {t:"<b>Prenotification:</b> age, last seen well, BEFAST, RACE if done, RBS, BP, anticoagulant status, ETA.",scope:"AP",src:"CPG 3.1 p.62"},
  {t:"<b>Management:</b> position appropriately; oxygen as required; paracetamol and antiemetic if required. Penthrox removed. Don't lower BP with nitrates.",scope:"AP",src:"CPG 3.1 pp.63, 65"},
  {t:"<b>CCP:</b> not needed unless haemodynamic or airway compromise. Don't wait on scene; meet the CCP en route.",scope:"AP",src:"CPG 3.1 p.63"},
  {t:"<b>RACE competence:</b> the circular's RACE video is required; accurate scoring still needs an observed check.",scope:"AP",src:"Circular p.2"}]}
};

 { id:"trauma", title:"Trauma", category:"Module 1", hue:"--c-trauma", icon:"trauma", minutes:45, requires:["intro"],
   desc:"Extrication, the changed TXA indications, hands-on paediatric TXA preparation, seat belt sign bypass, and spinal or neurogenic shock.",
   coverage:"CPG 10.1, 10.2, 10.3, 10.4–10.7, 10.10, 10.11, 10.13 · TXA formulary · obstetric TXA crossover 12.1–12.4",
   units:[
    {title:"Extrication", lessons:[
     {id:"tr-1", title:"Trapped Patient Case", steps:[
      {type:"choice", label:"Case · before the update", scope:"AP", prompt:"Road traffic collision. The driver is alert, has neck pain, follows instructions and says they can stand. You find no neurological deficit. What is your first-choice extrication approach?",
       options:["Full immobilised extraction because of the neck pain","Self-extrication or minimally assisted extrication","Leave the patient in the vehicle until the pain settles"], answer:1,
       fb:["Neck or back pain is no longer a reason for an immobilised extraction. Self-extrication is now first line unless there's a contraindication.",null,"Trapped patients are time critical. Extricate as soon as possible."],
       explain:"Self-extrication or minimal assistance is now the standard first-line technique for patients without contraindications, including those with neck or back pain.", src:"CPG 10.13 p.200"},
      {type:"read", title:"What changed", scope:"AP", body:"CPG 10.13 is new. Self-extrication, or minimally assisted extrication, is the first-line technique for every patient without a contraindication. That includes:",
       points:["Children who can follow instructions","Patients with neck or back pain","Soft neurological signs, such as non-dermatomal tingling, and signs of central cord syndrome","<b>Contraindications:</b> can't understand or follow instructions · injuries or baseline function that prevent standing on at least one leg","<b>Hard neurological signs</b> (loss of motor and sensory function): rapid extrication with gentle handling","Conscious with no neuro deficit: no manual in-line stabilisation needed in the vehicle","Assisted means gentle support, like an arm to stand or holding the belt. Never drag or lift."], src:"CPG 10.13 p.200"},
      {type:"walk", label:"Interactive algorithm", title:"Work through the extrication decision", scope:"AP",
       case:"Alert driver with neck pain. Follows instructions, says they can stand, no neurological deficit.", start:"s",
       nodes:{s:{q:"Is there an immediate threat to life, or is the patient unconscious with absent or ineffective breathing?",opts:[{t:"No",to:"a"},{t:"Yes",why:"Check the case: the driver is alert and talking."}]},
              a:{q:"Can the patient understand and follow instructions?",opts:[{t:"Yes",to:"b"},{t:"No",why:"Check the case: the driver follows instructions."}]},
              b:{q:"Can they stand on at least one leg?",opts:[{t:"Yes",to:"c"},{t:"No",why:"Check the case: the driver says they can stand."}]},
              c:{q:"Any hard neurological signs (loss of motor and sensory function)?",opts:[{t:"No",to:"e"},{t:"Yes",why:"Check the case: no neurological deficit was found."}]},
              e:{end:"Self-extrication or minimal assistance. Use U-STEP Out to guide it. Stop if any clinical concern appears.",tone:"p1"}},
       src:"CPG 10.13 pp.200–201"},
      {type:"choice", label:"Case changes", scope:"AP", prompt:"Same collision, different driver: confused and unable to follow instructions. Is self-extrication still the first choice?",
       options:["Yes, as long as the neck pain is mild","No. Being unable to follow instructions is a contraindication","Yes, confusion doesn't affect extrication"], answer:1,
       explain:"Inability to understand or follow instructions is a contraindication to self-extrication. Use manual extrication (combi-carrier or trauma board).", src:"CPG 10.13 pp.200, 202"},
      {type:"choice", label:"Case changes", scope:"AP", prompt:"Another driver can stand on both legs but reports pins and needles in one hand that doesn't follow a dermatome. Strength and sensation are otherwise normal. What does this change?",
       options:["Nothing: soft signs like non-dermatomal tingling still allow self-extrication","They need a rapid extrication with gentle handling","They must stay in the vehicle until fully immobilised"], answer:0,
       fb:[null,"Rapid extrication is for hard signs: loss of motor and sensory function.","Soft neurological signs are explicitly included in the self-extrication group."],
       explain:"Non-dermatomal tingling is a soft sign, so self-extrication is still first line. Reassess as you go.", src:"CPG 10.13 p.200"},
      {type:"choice", label:"Case changes", scope:"AP", prompt:"A third driver can't move or feel either leg. Which approach?",
       options:["Self-extrication with verbal guidance","Rapid extrication with gentle handling","Leave them until a full set of observations is done"], answer:1,
       explain:"Hard neurological signs (loss of motor and sensory function) mean rapid extrication with gentle handling. Keep monitoring to a minimum while they're trapped.", src:"CPG 10.13 p.200"},
      {type:"multi", label:"While trapped", scope:"AP", prompt:"The patient is trapped while Civil Defence cut the car. Which interventions belong in the vehicle?",
       options:["Haemorrhage control","TXA if indicated","Analgesia (Penthrox or ketamine) to help extrication","Full head-to-toe assessment","Repeated full sets of vital signs","Psychological support, with an extrication buddy if possible"], answer:[0,1,2,5],
       explain:"Limit care to critical interventions: haemorrhage control, TXA if indicated and analgesia to facilitate extrication, plus psychological support. Keep monitoring minimal; do the full head-to-toe once they're out.", src:"CPG 10.13 pp.200–202"}
     ]},
     {id:"tr-2", title:"U-STEP Out", steps:[
      {type:"read", title:"The U-STEP Out tool", scope:"AP", visual:"ustep", body:"CPG 10.13 includes the U-STEP Out decision tool to guide self-extrication. Before you start, ask: <b>does this casualty need a snatch rescue?</b> If there's an immediate threat to life, or they're unconscious with absent or ineffective breathing, perform an immediate extrication. Stop using the tool at any clinical concern or contraindication.", src:"CPG 10.13 p.201"},
      {type:"walk", label:"Guide the casualty", title:"Talk them out, step by step", scope:"AP",
       case:"Alert driver, neck pain, no contraindications. Civil Defence have the door open.", start:"u",
       nodes:{u:{q:"Step 1. What do you check first?",opts:[{t:"That they understand: wind the window down or give a thumbs up",to:"s"},{t:"Ask them to step out",why:"Check understanding first. A casualty who can't follow instructions isn't suitable."},{t:"Ask them to move their legs",why:"That's step 3. Start by checking they understand."}]},
              s:{q:"Step 2. Support. What do you do?",opts:[{t:"Reassure them and explain you'll keep them safe, in language they understand",to:"t"},{t:"Apply a collar and lift them out",why:"Self-extrication doesn't involve lifting. Support means reassurance and explanation."}]},
              t:{q:"Step 3. Try moving. Ask them to move both legs. They can't move one leg. What now?",opts:[{t:"Carry on to egress",why:"If they can't move both legs, they won't be able to self-extricate."},{t:"Stop: they won't be able to self-extricate",to:"t2"}]},
              t2:{q:"Back to our driver, who moves both legs easily. Step 4?",opts:[{t:"Egress: door fully open, all obstructions out of the way",to:"p"},{t:"Plan where they'll go",why:"Clear the exit (egress) before planning the destination."}]},
              p:{q:"Step 5. Plan. What do you sort out?",opts:[{t:"Where they go next: chair or stretcher, placed close to the vehicle",to:"o"},{t:"The hospital destination only",why:"Plan the immediate next place: chair or stretcher, close by. The stretcher must be ready."}]},
              o:{q:"Step 6. Out. How do they leave the vehicle?",opts:[{t:"Ask them to step out, supporting only if required",to:"e"},{t:"Pull them out by the arms",why:"Never drag or lift the casualty."}]},
              e:{end:"Out. A rigid collar can be used as an extrication aid; consider removing it once they're on the stretcher. Apply SMR if indicated.",tone:"p1"}},
       src:"CPG 10.13 pp.201–202"},
      {type:"choice", label:"Check", scope:"AP", prompt:"Before starting U-STEP Out, you find the patient unconscious with ineffective breathing. What do you do?",
       options:["Use U-STEP Out slowly","Immediate (snatch) extrication","Wait for them to wake"], answer:1,
       explain:"Immediate threat to life or unconscious with absent or ineffective breathing: perform an immediate extrication. U-STEP Out is only for suitable, cooperative casualties.", src:"CPG 10.13 p.201"}
     ]}
    ]},
    {title:"Tranexamic acid (TXA)", lessons:[
     {id:"tr-3", title:"TXA Indications", steps:[
      {type:"read", title:"Who gets paediatric TXA", scope:"AP", body:"Paediatric IV TXA is now within AP scope. Indications (AP and CCP):",
       points:["A <b>child under 14</b> with <b>major trauma less than 3 hours old</b>, and either:","&nbsp;&nbsp;• suspected or confirmed major haemorrhage, or","&nbsp;&nbsp;• isolated traumatic brain injury with <b>GCS ≤12</b>","<b>Contraindications:</b> hypersensitivity to TXA · injury more than 3 hours old · significant blood loss unlikely"],
       src:"HMCAS Paediatric IV TXA poster · Circular rows 12–18, 20, 27–28"},
      {type:"sort", label:"Sort the cases", scope:"AP", prompt:"Give or withhold TXA?", bins:["Give TXA","Withhold TXA"],
       cards:[{t:"6 years, pelvic injury 40 minutes ago, pale and tachycardic",b:0},{t:"9 years, isolated head injury 1 hour ago, GCS 11",b:0},{t:"4 years, fall 4 hours ago, suspected internal bleeding",b:1},{t:"7 years, closed wrist fracture, haemodynamically normal",b:1},{t:"10 years, major haemorrhage, previous anaphylaxis to TXA",b:1},{t:"11 years, isolated head injury 30 minutes ago, GCS 14",b:1}],
       explain:"Give: major trauma under 3 hours with suspected major haemorrhage, or isolated TBI with GCS ≤12. Withhold: injury over 3 hours old, significant blood loss unlikely, TXA hypersensitivity, or isolated head injury with GCS above 12.", src:"HMCAS Paediatric IV TXA poster"},
      {type:"read", title:"Obstetric TXA (crossover)", scope:"AP", body:"In obstetrics, TXA is now indicated for <b>postpartum haemorrhage only</b>. It has been removed from the ectopic pregnancy, miscarriage, placental abruption and placenta praevia algorithms (CPG 12.1–12.4).", src:"Circular rows 22–25, 29 · Summary p.4"},
      {type:"sort", label:"Sort the cards", scope:"AP", prompt:"Is TXA an indication in v2.6?", bins:["TXA indication","Not a TXA indication"],
       cards:[{t:"Postpartum haemorrhage",b:0},{t:"Ectopic pregnancy with bleeding",b:1},{t:"Miscarriage",b:1},{t:"Placental abruption",b:1},{t:"Placenta praevia",b:1}],
       explain:"PPH is the only obstetric TXA indication. Removal from the other algorithms does not remove the need for urgent haemorrhage care.", src:"Circular rows 22–25, 29"}
     ]},
     {id:"tr-4", title:"TXA Dose Chart", steps:[
      {type:"read", title:"Dose from the chart", scope:"AP", visual:"txachart", body:"The dose is <b>15 mg/kg</b>, using the chart's estimated weight for the child's age. For babies aged 0–12 months, weight = (age in months × 0.5) + 4. Once 1 g is in the 100 mL bag the concentration is <b>10 mg/mL</b>, so volume (mL) = dose (mg) ÷ 10.",
       points:["Poster example: 4-year-old, 16 kg → 240 mg → 24 mL, given over 10 minutes"], src:"HMCAS Paediatric IV TXA poster"},
      {type:"input", label:"Practice · baby", scope:"AP", prompt:"An 8-month-old baby meets the criteria. What is the estimated weight?", answer:"8", unit:"kg", explain:"(8 × 0.5) + 4 = 8 kg.", src:"HMCAS Paediatric IV TXA poster"},
      {type:"input", label:"Practice · baby", scope:"AP", prompt:"What dose does that 8 kg baby need at 15 mg/kg?", answer:"120", unit:"mg", explain:"8 kg × 15 mg/kg = 120 mg.", src:"HMCAS Paediatric IV TXA poster"},
      {type:"input", label:"Practice · baby", scope:"AP", prompt:"What volume do you draw from the 10 mg/mL bag?", answer:"12", unit:"mL", explain:"120 mg ÷ 10 mg/mL = 12 mL, given over 10 minutes.", src:"HMCAS Paediatric IV TXA poster"},
      {type:"input", label:"Practice · chart", scope:"AP", visual:"txachart", prompt:"A 6-year-old meets the criteria. Using the chart, what volume do you give?", answer:"37", unit:"mL", explain:"The chart gives 25 kg → 370 mg → 37 mL, over 10 minutes.", src:"HMCAS Paediatric IV TXA poster"},
      {type:"read", title:"Children aged 8 and over, or over 30 kg", scope:"AP", body:"For these children you don't draw the dose up. Instead:",
       points:["Add 1 g to the 100 mL bag as usual","<b>Draw out and discard</b> the volume the chart shows for the child's age","Give the <b>remaining volume</b> over 10 minutes","The remaining volume includes 10 mL to compensate for the administration set"], src:"HMCAS Paediatric IV TXA poster"},
      {type:"choice", label:"Case", scope:"AP", visual:"txachart", prompt:"A 10-year-old (37 kg) meets the criteria. What do you do with the bag?",
       options:["Draw out and discard 35 mL, then give the remaining volume over 10 minutes","Draw up 55 mL into a syringe and give it","Give the whole 100 mL bag over 10 minutes"], answer:0,
       fb:[null,"For children aged 8 and over or over 30 kg, draw out the chart volume and give the remainder through the set. The remainder includes a 10 mL administration-set compensation.","The whole bag is 1 g, far more than this child's 550 mg dose."],
       explain:"Draw out and discard 35 mL. The 55 mL dose plus 10 mL set compensation remain, and you give that over 10 minutes.", src:"HMCAS Paediatric IV TXA poster"},
      {type:"input", label:"Practice · chart", scope:"AP", visual:"txachart", prompt:"A 12-year-old meets the criteria. How much do you draw out and discard?", answer:"26", unit:"mL", explain:"Draw out 26 mL, then give the remaining volume (64 mL dose) over 10 minutes.", src:"HMCAS Paediatric IV TXA poster"}
     ]},
    ]},

    {title:"Destination and spinal", lessons:[
     {id:"tr-5", title:"Seat Belt Sign Bypass", steps:[
      {type:"choice", label:"Case", scope:"AP", prompt:"A restrained driver has bruising across the abdomen from the seat belt. Vital signs are currently within normal limits. What does v2.6 add to your destination decision?",
       options:["The abdominal seat belt sign is now included in the trauma bypass criteria, so apply the CPG 10.10 destination decision","Seat belt marks only matter if the patient is hypotensive","Nothing has changed for seat belt injuries"], answer:0,
       fb:[null,"Normal vital signs don't remove the new criterion. Check the bypass criteria in CPG 10.10.","The abdominal seat belt sign is a new bypass criterion in v2.6."],
       explain:"The abdominal seat belt sign is now a bypass criterion. The full destination decision follows approved CPG 10.10.", src:"Circular row 19 · Summary p.4"}
     ]},
     {id:"tr-6", title:"Spinal & Neurogenic Shock", steps:[
      {type:"read", title:"Two shock patterns, two targets", scope:"AP", body:"CPG 10.3 adds a section on spinal cord injury and neurogenic shock. Rule out other causes of shock first, such as major haemorrhage and TBI.",
       points:["<b>Isolated</b> spinal cord injury with neurogenic shock: MAP <b>85–90 mmHg</b>","<b>Combined</b> haemorrhagic and neurogenic shock: MAP <b>≥65 mmHg</b>","Avoid hypotension; give fluids judiciously and avoid overload","<span class='badge ccp'>CCP</span> Noradrenaline is the preferred vasopressor (adults); add an adrenaline infusion if bradycardia and hypotension persist","<span class='badge ccp'>CCP</span> Consider early intubation for C1–4 injury with airway or breathing compromise, keeping in-line stabilisation"], src:"CPG 10.3 pp.177–178"},
      {type:"choice", label:"Case", scope:"AP", prompt:"A motorcyclist with a suspected spinal injury is hypotensive and has a possible pelvic injury. Which MAP target applies?",
       options:["85–90 mmHg, because it's a spinal injury","≥65 mmHg, as combined haemorrhagic and neurogenic shock","No target until the CCP arrives"], answer:1,
       fb:["85–90 mmHg is for isolated neurogenic shock. A possible pelvic bleed makes this combined shock.",null,"Manage hypotension now within AP scope and request a CCP."],
       explain:"Combined haemorrhagic and neurogenic shock: aim for MAP ≥65 mmHg. Manage the haemorrhage per its CPG and escalate for vasopressors.", src:"CPG 10.3 p.178"},
      {type:"read", title:"Revised spinal motion restriction", scope:"AP", body:"When SMR is indicated:",
       points:["Size collars correctly; remove a rigid collar if it causes discomfort or distress","The combi-carrier is mainly an extrication or carrying device: consider removing it once the patient is on the stretcher","Keep the <b>unconscious</b> trauma patient on the combi-carrier","Secure with spider harness (on the board) or stretcher straps","<b>Head blocks always</b>, on the board or the stretcher","Stretcher may be raised <b>up to 30°</b> if lying flat causes distress"], src:"CPG 10.3 p.178"},
      {type:"sort", label:"Sort the patients", scope:"AP", prompt:"On the stretcher: keep the combi-carrier, or consider removing it?", bins:["Keep the combi-carrier","Consider removing it"],
       cards:[{t:"Unconscious after a rollover",b:0},{t:"Alert, neck pain, distressed lying on the board",b:1},{t:"GCS 15 after self-extrication, on the stretcher",b:1},{t:"GCS 6, intubated by CCP",b:0}],
       explain:"Consider removing the board once the patient is on the stretcher, particularly if it causes distress. Keep unconscious trauma patients on it. Head blocks either way.", src:"CPG 10.3 p.178"}
     ]},
     {id:"tr-7", title:"Hands-on: On the Stretcher", scene:"smr", steps:[{type:"stage",stage:"smr"},{type:"stage",stage:"smr",variant:"unc"}]}
    ]},
