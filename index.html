 { id:"newborn", title:"Newborn Care & Resuscitation", category:"Module 2", hue:"--c-newborn", icon:"newborn", minutes:45, requires:["intro"],
   desc:"New routine care of the newborn (CPG 12.13) with hands-on thermal care, and revised newborn resuscitation (CPG 2.5).",
   coverage:"New CPG 12.13 · revised CPG 2.5",
   units:[
    {title:"Two pathways", lessons:[
     {id:"nb-1", title:"Two Newborns", steps:[
      {type:"choice", label:"Case", scope:"AP", prompt:"Two births on the same shift. Baby A is term, crying and breathing well. Baby B is preterm and not breathing effectively. Which pathway applies to Baby B?",
       options:["Routine newborn care (CPG 12.13)","Newborn resuscitation (CPG 2.5)","Adult cardiac arrest"], answer:1,
       explain:"A baby who is not breathing effectively follows the newborn resuscitation pathway.", src:"CPG 12.13 p.245 · CPG 2.5"},
      {type:"choice", label:"Case", scope:"AP", prompt:"And Baby A?", options:["Routine newborn care (CPG 12.13)","Newborn resuscitation (CPG 2.5)"], answer:0,
       explain:"A breathing term baby follows the new routine care guideline, CPG 12.13.", src:"CPG 12.13 · Circular row 26"},
      {type:"read", title:"Keep the pathways separate", visual:"ways", body:"v2.6 adds a new routine care guideline and revises resuscitation. Decide which pathway applies first, then set your thermal and ventilation priorities. Before the birth: take the obstetric history (including gestation), prepare resuscitation equipment and a plan, and warm the environment.", src:"CPG 12.13 pp.248–249"},
      {type:"walk", label:"Interactive algorithm", title:"Work through Baby B", scope:"AP",
       case:"Baby B: born at 30 weeks, not breathing effectively. Meconium-stained liquor. You can't see any obstruction.", start:"a",
       nodes:{a:{q:"Is the baby breathing effectively?",opts:[{t:"Yes",why:"Baby B is not breathing effectively, so this is the resuscitation pathway."},{t:"No",to:"b"}]},
              b:{q:"Cord clamped and cut, baby dried and warm, head neutral, jaw thrust. Is there obstruction seen under direct vision?",opts:[{t:"Yes",why:"No obstruction is visible in this case."},{t:"No",to:"c"}]},
              c:{q:"What comes next?",opts:[{t:"Routine suction because of the meconium",why:"Suction is only for obstruction seen under direct vision. The meconium indication was removed."},{t:"Five inflation breaths of 2–3 s with PEEP 6",to:"d"},{t:"Start chest compressions",why:"Ventilation comes first. Compressions start only if HR stays <60 after 30 s of ventilation."}]},
              d:{q:"Baby B is 30 weeks. Which oxygen for the inflation breaths?",opts:[{t:"Room air (21%)",why:"Room air is for 32 weeks or more."},{t:"30% oxygen",to:"e"},{t:"100% oxygen",why:"100% is for when compressions are needed."}]},
              e:{end:"Check for chest rise and reassess heart rate. If HR stays below 60 after 30 seconds of ventilation, start compressions at 3:1 with 100% oxygen.",tone:"p1"}},
       src:"CPG 2.5 pp.51–52"}
     ]},
     {id:"nb-2", title:"Thermal Care & Risks", steps:[
      {type:"read", title:"Normal newborn observations", scope:"AP", body:"CPG 12.13 gives these normal ranges:",
       points:["<b>Respiratory rate</b> 40–60/min, counted over 1 minute. Irregular, abdominal breathing is normal","<b>Heart rate</b> 100–160/min, auscultated for 1 minute; use SpO₂ and ECG monitoring too","<b>Temperature</b> 36–37.5 °C","<b>Tone</b> flexed. A floppy baby needs urgent care","<b>Colour</b> centrally pink mucous membranes. Skin tone can differ for the first few minutes"], src:"CPG 12.13 pp.246–247"},
      {type:"read", title:"Thermal care is mandatory", scope:"AP", body:"Keep the newborn's temperature <b>at or above 36.5 °C</b> throughout care and transport.",
       points:["Warm the room or ambulance: doors and windows closed, AC off or on its lowest setting. Ideally move to the ambulance","Dry thoroughly, especially the head","Warm hat (the beanie in the obstetric kit)","Wrap in blankets or towels and thermal foil wrap","<b>Preterm (&lt;37 weeks):</b> thermal mattress and plastic bag wrap are also mandatory","Skin-to-skin is optional: only if mother and baby are well and warm and you can monitor airway and breathing","Measure temperature soon after birth, during transport and on arrival; record it in the ePCR"], src:"CPG 12.13 pp.247–248"},
      {type:"choice", label:"Check", scope:"AP", prompt:"A baby is born at 35 weeks and is breathing well. Which thermal care is mandatory?",
       options:["Dry, hat and wrap only, because the baby is well","Dry, hat and wrap, plus a thermal mattress and plastic bag wrap","Skin-to-skin contact instead"], answer:1,
       explain:"Under 37 weeks is preterm, so the thermal mattress and plastic bag wrap are mandatory on top of drying, a hat and wrapping.", src:"CPG 12.13 p.247"},
      {type:"multi", label:"Risks", scope:"AP", prompt:"Which newborns are at risk of hypoglycaemia?",
       options:["Preterm (<37 weeks)","Birth weight <2.5 kg","Needed resuscitation at birth","Mother has diabetes","Hypothermic","Term baby, 3.4 kg, crying, warm, mother well"], answer:[0,1,2,3,4],
       explain:"Risk factors also include small for gestational age, a mother on beta-blockers, perinatal hypoxia and infection or sepsis. Good thermal care helps prevent hypoglycaemia.", src:"CPG 12.13 pp.245, 248"},
      {type:"read", title:"Other risks to look for", scope:"AP", body:"Assess for the newborn's main clinical risks:",
       points:["<b>Hypoxia:</b> cord compression or prolapse, placental or cord bleeding; meconium may indicate perinatal hypoxia","<b>Sepsis:</b> maternal antibiotics for infection, GBS this pregnancy or a previous GBS baby, preterm pre-labour rupture, membranes ruptured &gt;18 hours","<b>Jaundice risk:</b> &lt;38 weeks, siblings with neonatal jaundice, bruising from instrumental or caesarean birth, diabetic mother","<b>Exposed organs:</b> cover with cling film, but never wrap it all the way around","Prenotify the receiving obstetric unit if the baby has complications or is being resuscitated"], src:"CPG 12.13 pp.245–248"}
     ]}
    ]},
    {title:"Thermal care: hands-on", lessons:[
     {id:"th-v", title:"Watch: Thermal Care", steps:[{type:"watch",title:"Keeping the newborn warm",scope:"AP",body:"Watch this video before the hands-on thermal care practice.",src:null}]},
     {id:"th-1", title:"The Birth", scene:"thermo", steps:[{type:"stage",stage:"thintro"},{type:"stage",stage:"th",key:"dry"}]},
     {id:"th-2", title:"Cap & Wrap", scene:"thermo", steps:[{type:"stage",stage:"th",key:"cap"},{type:"stage",stage:"th",key:"towel"},{type:"stage",stage:"th",key:"thermal"}]},
     {id:"th-3", title:"First Temperature Check", scene:"thermo", steps:[{type:"stage",stage:"th",key:"temp1"}]},
     {id:"th-4", title:"Warm the Room", scene:"thermo", steps:[{type:"stage",stage:"th",key:"ac"},{type:"stage",stage:"th",key:"door"}]},
     {id:"th-5", title:"Reassess & Monitor", scene:"thermo", steps:[{type:"stage",stage:"th",key:"temp2"}]},
     {id:"th-6", title:"Solo Round", scene:"thermo", thRun:true, steps:[{type:"stage",stage:"th",key:"dry"},{type:"stage",stage:"th",key:"cap"},{type:"stage",stage:"th",key:"towel"},{type:"stage",stage:"th",key:"thermal"},{type:"stage",stage:"th",key:"temp1"},{type:"stage",stage:"th",key:"ac"},{type:"stage",stage:"th",key:"door"},{type:"stage",stage:"th",key:"temp2"}]}
    ]},
    {title:"Resuscitation", lessons:[
     {id:"nb-3", title:"Initial Breaths", steps:[
      {type:"read", title:"Assess, then open the airway", scope:"AP", body:"Assess immediately after birth: <b>breathing</b>, <b>heart rate</b>, <b>response to tactile stimulation</b> and <b>tone</b>. Skin colour is no longer used to judge oxygenation.",
       points:["Breathing: regular is satisfactory; slow, gasping or grunting may need intervention; absent needs intervention","Heart rate: &gt;100 satisfactory; 60–100 may need intervention; &lt;60 needs intervention","Stimulate gently by drying or rubbing the soles or back. Never vigorously","Head neutral (pad under the shoulders if needed); <b>jaw thrust</b> preferred","Suction <b>only</b> for obstruction, under direct vision: mouth, then nose","OPA if BVM ventilation is expected to be difficult; SGA if BVM is ineffective, apnoea persists, or prolonged ventilation and compressions are needed"], src:"CPG 2.5 pp.50–51"},
      {type:"read", title:"Five inflation breaths", scope:"AP", body:"For an apnoeic, gasping or ineffectively breathing newborn, start positive pressure ventilation, ideally within 60 seconds of birth.",
       points:["<b>5 inflation breaths</b>, each with an inflation time of <b>2–3 seconds</b>","Attach a <b>PEEP valve</b> to the BVM: <b>6 cmH₂O</b>","<b>≥32 weeks:</b> room air (21%)","<b>&lt;32 weeks:</b> 30% oxygen","Look for chest rise. If none: open the airway, reposition, check the volume","A rising HR or a stable HR &gt;100 means ventilation is working"], src:"CPG 2.5 p.51"},
      {type:"choice", label:"Case", scope:"AP", prompt:"The liquor is meconium-stained and the baby is not breathing. You cannot see any obstruction. What do you do about suction?",
       options:["Suction routinely before giving breaths","Don't suction; start five inflation breaths with a PEEP valve","Suction until the liquor runs clear"], answer:1,
       fb:["Suction is used only for obstruction seen under direct vision.",null,"Prolonged suction delays ventilation. Suction only for visible obstruction."],
       explain:"With no visible obstruction, move straight on to the five inflation breaths.", src:"CPG 2.5 p.51"},
      {type:"choice", label:"Case", scope:"AP", prompt:"A baby born at 38 weeks is apnoeic. Which settings do you use for the inflation breaths?",
       options:["Room air with PEEP 6 cmH₂O","30% oxygen with PEEP 6 cmH₂O","100% oxygen with no PEEP"], answer:0,
       explain:"At 32 weeks or more, ventilate with room air (21%) and PEEP 6 cmH₂O.", src:"CPG 2.5 p.51"},
      {type:"input", label:"Practice", scope:"AP", prompt:"How long should each inflation breath last, at most?", answer:"3", unit:"seconds", explain:"Each of the 5 inflation breaths has an inflation time of 2–3 seconds.", src:"CPG 2.5 p.51"}
     ]},
     {id:"nb-4", title:"Further Care", steps:[
      {type:"read", title:"If the heart rate stays low", scope:"AP", body:"Bradycardia in the newborn is usually due to hypoxia, so effective ventilation comes first.",
       points:["Start compressions if HR stays <b>&lt;60 after 30 seconds</b> of BVM ventilation","Increase oxygen to <b>100%</b>; prepare an SGA and IV/IO access","Ratio <b>3:1</b>, and keep 3:1 once an SGA is in","<b>Two-thumb encircling</b> technique","Reassess HR and breathing <b>every 30 seconds</b>","Once breathing adequately with HR &gt;100: stop ventilations and titrate oxygen down"], src:"CPG 2.5 p.52"},
      {type:"walk", label:"Interactive algorithm", title:"Reassess and branch", scope:"AP",
       case:"Term baby, apnoeic. You've given 5 inflation breaths with PEEP 6 in room air and are ventilating with good chest rise.", start:"a",
       nodes:{a:{q:"After 30 seconds of ventilation, HR is 50. What now?",opts:[{t:"Keep ventilating and recheck in 2 minutes",why:"HR <60 after 30 s of ventilation is the compression trigger."},{t:"Compressions 3:1, two-thumb, oxygen up to 100%",to:"b"},{t:"Compressions 15:2",why:"Newborn ratio is 3:1."}]},
              b:{q:"When do you next check HR and breathing?",opts:[{t:"In 30 seconds",to:"c"},{t:"In 2 minutes",why:"Reassess every 30 seconds."}]},
              c:{q:"HR is now 120 and the baby is breathing on their own. What next?",opts:[{t:"Stop ventilations and titrate oxygen to the target SpO₂",to:"e"},{t:"Continue compressions for 2 more minutes",why:"HR >100 with adequate breathing: stop compressions and ventilations."}]},
              e:{end:"Aim for SpO₂ >80% and HR >100 by 5 minutes. Keep temperature 36.5–37.5 °C.",tone:"p1"}},
       src:"CPG 2.5 p.52"},
      {type:"read", title:"Targets and other care", scope:"AP", body:"Expected preductal SpO₂ rises over the first 10 minutes:",
       points:["1 min 60–65% · 2 min 65–70% · 3 min 70–75% · 4 min 75–80% · 5 min 80–85% · 10 min 85–95%","Avoid SpO₂ &lt;80% or bradycardia at 5 minutes","Fluids: normal saline <b>10 ml/kg</b> IV/IO, may be repeated once","Still poorly responsive despite good ventilation, perfusion and temperature: check RBS from the lateral heel; if low, dextrose 10% <b>2 ml/kg</b>","Shockable rhythm is very rare: <b>4 J/kg</b>, pads anterior-posterior","Parents may stay; assign a paramedic to support them if resources allow"], src:"CPG 2.5 pp.51–52"},
      {type:"choice", label:"Check", scope:"AP", prompt:"At 3 minutes after birth the baby's SpO₂ is 72% and HR is 130. What do you make of this?",
       options:["Within the expected range for 3 minutes","Hypoxic: start compressions","Increase to 100% oxygen immediately"], answer:0,
       explain:"At 3 minutes the expected SpO₂ is 70–75%. Aim for >80% by 5 minutes.", src:"CPG 2.5 p.51 · CPG 12.13 p.249"}
     ]},
     {id:"nb-5", title:"Glucose & Cord", steps:[
      {type:"sort", label:"Match the context", scope:"AP", prompt:"Match each glucose treatment to its context.", bins:["Routine newborn care","Newborn resuscitation"],
       cards:[{t:"Pea-sized buccal glucose, repeat as required",b:0},{t:"Dextrose 10% 2 ml/kg IV/IO",b:1},{t:"Treat if RBS <2.6 mmol/L",b:0},{t:"Check RBS if responsiveness stays poor despite good ventilation",b:1}],
       explain:"Routine care: RBS <2.6 mmol/L → buccal glucose; IV dextrose is generally not needed. Resuscitation: dextrose 10% 2 ml/kg if hypoglycaemic. Never glucagon.", src:"CPG 12.13 pp.248–249 · CPG 2.5 p.52"},
      {type:"choice", label:"Check", scope:"AP", prompt:"A colleague suggests IM glucagon for a hypoglycaemic newborn. What do you say?",
       options:["Fine, it's the fastest route","No: glucagon should not be given to a newborn. Use buccal glucose","Only if the RBS is below 1"], answer:1,
       explain:"Glucagon should not be administered to the newborn. Early breastfeeding can help prevent hypoglycaemia, but not if it risks hypothermia.", src:"CPG 12.13 p.248"},
      {type:"read", title:"The umbilical cord", scope:"AP", body:"For a well baby, leave the cord intact for <b>at least 60 seconds</b> after birth (it turns white), then clamp and cut about <b>5 cm</b> from the umbilicus.",
       points:["If resuscitation or urgent intervention is needed, <b>don't delay</b>: clamp, cut and move to a dry, warm area","If the cord has snapped, watch for hypovolaemia: pale mucous membranes, respiratory distress"], src:"CPG 12.13 p.247 · CPG 2.5 p.52"},
      {type:"choice", label:"Case", scope:"AP", prompt:"A newborn is floppy and apnoeic at birth. When do you clamp the cord?",
       options:["Wait the full 60 seconds first","Clamp and cut now so resuscitation isn't delayed","Leave it until hospital"], answer:1,
       explain:"Delayed clamping is for well babies. If urgent resuscitation is needed, clamp and cut straight away.", src:"CPG 2.5 p.52"},
      {type:"read", title:"Very early births", scope:"AP", body:"This is one of the hardest situations you'll attend. CPG 12.13 and 2.5 give clear guidance:",
       points:["Babies born <b>under 20 weeks</b> are not viable and resuscitation is not required","They may show brief reflex activity (gasps, chest wall pulsation, twitches), usually in the first minute. These are not signs of viable life","Explain gently to the parents that the baby has been born too early to survive, and that they may see these movements","Wrap the baby and offer the parents the chance to hold them","Over 20 weeks, or gestation unknown with signs of life: resuscitate per CPG 2.5","<b>If in doubt, resuscitate.</b> Once started prehospitally, resuscitation is not stopped"], src:"CPG 12.13 pp.247–248 · CPG 2.5 p.52"},
      {type:"choice", label:"Check", scope:"AP", prompt:"The mother isn't sure of her dates. The baby is small and gasping. What do you do?",
       options:["Withhold resuscitation because the baby looks very premature","Begin resuscitation: gestation is uncertain and there are signs of life","Wait a minute to see if the gasps continue"], answer:1,
       explain:"If gestation is unknown and there are signs of life, or if in any doubt, start resuscitation.", src:"CPG 12.13 p.247"}
     ]}
    ]},
    {title:"Newborn resuscitation: hands-on", lessons:[
     {id:"nr-1", title:"Kit, Cord & Airway", scene:"nbr", steps:[{type:"stage",stage:"nrintro"},{type:"stage",stage:"nrkit"},{type:"stage",stage:"nrcord"}]},
     {id:"nr-2", title:"Set Up the BVM", scene:"nbr", steps:[{type:"stage",stage:"nrset"}]},
     {id:"nr-3", title:"Inflation Breaths", scene:"nbr", steps:[{type:"stage",stage:"nrbreath"}]},
     {id:"nr-4", title:"Heart Rate & Compressions", scene:"nbr", steps:[{type:"stage",stage:"nrhr"},{type:"stage",stage:"nrcomp"}]},
     {id:"nr-5", title:"Targets & Glucose", scene:"nbr", steps:[{type:"stage",stage:"nrmon"},{type:"stage",stage:"nrglu"}]},
     {id:"nr-6", title:"Solo Run", scene:"nbr", rxRun:"nbr", steps:[{type:"stage",stage:"nrkit"},{type:"stage",stage:"nrcord"},{type:"stage",stage:"nrset"},{type:"stage",stage:"nrbreath"},{type:"stage",stage:"nrhr"},{type:"stage",stage:"nrcomp"},{type:"stage",stage:"nrmon"},{type:"stage",stage:"nrglu"}]}
    ]},
    {title:"Module check", lessons:[{id:"nb-x", title:"Newborn Check", mode:"exit", bank:"newborn"}]}
   ]},

 { id:"cardiac", title:"Cardiac Arrest", category:"Module 3", hue:"--c-cardiac", icon:"cardiac", minutes:40, requires:["intro"],
   desc:"Adult medical, adult trauma and paediatric arrest, ROSC, special circumstances, cardioversion and antiemetic handover.",
   coverage:"CPG 2.1–2.4, 2.6, 2.8, 2.9, 4.3, 4.4, 6.4 · newborn resuscitation is in Module 2",
   units:[
    {title:"Arrest algorithms", lessons:[
     {id:"ca-1", title:"Adult Medical Arrest", steps:[
      {type:"sort", label:"Adult medical · build the timeline", pop:"Adult medical arrest", scope:"AP", prompt:"Shockable rhythm. Place each milestone.", bins:["After shock 3","After shock 5","Every 4 minutes"],
       cards:[{t:"First adrenaline",b:0},{t:"Amiodarone 300 mg",b:0},{t:"Amiodarone 150 mg",b:1},{t:"Repeat adrenaline",b:2}],
       explain:"Adrenaline and amiodarone 300 mg after the third shock, amiodarone 150 mg after the fifth, then adrenaline every four minutes.", src:"CPG 2.1 · Summary p.1"},
      {type:"read", title:"Adult medical arrest timeline", pop:"Adult medical arrest", scope:"AP", visual:"timeline", body:"These milestones apply to <b>adult medical arrest only</b>. In <b>non-shockable</b> rhythms, give adrenaline <b>as soon as</b> IV/IO access is in, then every 4 minutes.",
       points:["<b>Energy:</b> LP15 200, 300, 360 J · Zoll 150, 200, 200 J","<b>DSED:</b> maximum 3, then standard anterior-posterior pads at maximum joules. Vector change: APs and CCPs","<b>CPR:</b> 100–120/min, 5–6 cm, full recoil, pauses &lt;5 s. If in doubt, assume arrest","<b>Airway:</b> waveform capnography with any advanced airway, aim EtCO₂ ≈25 mmHg; APs may now pass a gastric tube via the SGA","<b>CPR-induced consciousness:</b> no neuromuscular blockers (CCP: ketamine 1 mg/kg)","<span class='badge ccp'>CCP</span> may use the mechanical ventilator. Check e-CPR criteria (CPG 2.9) and update NCC"], src:"CPG 2.1 · Summary p.1"},
      {type:"walk", label:"Interactive algorithm", title:"Step through the drug milestones", pop:"Adult medical arrest", scope:"AP",
       case:"Adult medical cardiac arrest, shockable rhythm, high-quality CPR ongoing.", start:"a",
       nodes:{a:{q:"Shock 3 delivered. What is due now?",opts:[{t:"Adrenaline and amiodarone 300 mg",to:"b"},{t:"Adrenaline only",why:"Amiodarone 300 mg is also due after the third shock."},{t:"Nothing yet",why:"Adrenaline and amiodarone 300 mg are both due after the third shock."}]},
              b:{q:"Shock 5 delivered. Which amiodarone dose?",opts:[{t:"300 mg",why:"300 mg was the first dose. The dose after the fifth shock is 150 mg."},{t:"150 mg",to:"e"},{t:"No further amiodarone",why:"A second dose of 150 mg is given after the fifth shock."}]},
              e:{end:"Adrenaline continues every 4 minutes. These milestones apply to adult medical arrest only.",tone:"p1"}},
       src:"CPG 2.1 · Summary p.1"},
      {type:"choice", label:"Check", pop:"Adult medical arrest", scope:"AP", prompt:"You're using a Zoll. What are the three energy levels?",
       options:["120, 150, 200 J","150, 200, 200 J","200, 300, 360 J"], answer:1,
       fb:["That was the v2.5 Zoll sequence.",null,"That's the LP15 sequence."],
       explain:"Zoll: 150, 200, 200 J. LP15 is unchanged: 200, 300, 360 J.", src:"CPG 2.1 p.37"},
      {type:"choice", label:"Check", pop:"Adult medical arrest", scope:"AP", prompt:"Adult in PEA. IV access has just been secured. When is the first adrenaline?",
       options:["Now, as soon as possible","After the SGA cycle","After the third rhythm check"], answer:0,
       explain:"Non-shockable: adrenaline as soon as possible once IV/IO is in, then every 4 minutes.", src:"Summary p.1 · CPG 2.1"}
     ]},
     {id:"ca-2", title:"Adult Trauma Arrest", steps:[
      {type:"choice", label:"Case", pop:"Adult trauma arrest", scope:"AP", prompt:"An adult in traumatic cardiac arrest after a high-speed collision. Which approach fits v2.6?",
       options:["Apply the adult medical drug timing","Prioritise the HOTT causes, keep scene time to the minimum, and give adrenaline only after volume replacement","Delay all interventions until hospital"], answer:1,
       fb:["Adult medical timing must not be reused for trauma arrest.",null,"Trauma arrest priorities start on scene."],
       explain:"Trauma arrest has its own priorities and its own drug timing.", src:"CPG 2.2 p.35"},
      {type:"read", title:"Trauma arrest priorities", pop:"Adult trauma arrest", scope:"AP", body:"Treat the reversible traumatic causes first (<b>HOTT</b>: hypovolaemia, oxygenation, tension pneumothorax, tamponade) and keep scene time to a minimum.",
       points:["<b>No adrenaline</b> until reversible causes are managed and at least <b>500 ml normal saline</b> has been given","Then adrenaline every 4 minutes","Amiodarone as in medical arrest: 300 mg after the 3rd shock, 150 mg after the 5th","Gastric tube via SGA: APs and CCPs"], src:"CPG 2.2 p.35"},
      {type:"input", label:"Practice", pop:"Adult trauma arrest", scope:"AP", prompt:"Minimum volume of normal saline before the first adrenaline in adult trauma arrest?", answer:"500", unit:"ml", explain:"At least 500 ml normal saline, with reversible causes managed.", src:"CPG 2.2 p.35"}
     ]},
     {id:"ca-3", title:"Paediatric Arrest", steps:[
      {type:"choice", label:"Case", pop:"Paediatric arrest", scope:"AP", prompt:"An 18 kg child is in cardiac arrest. Which combination fits v2.6?",
       options:["Anterior-posterior pads, using the child's actual weight where known","Anterior-lateral pads, estimating weight from age even when actual weight is known","Any pad position, estimating weight from age"], answer:0,
       explain:"Under 25 kg, anterior-posterior is first choice. Use the actual weight from parents or caregivers; use an age-based formula only if it isn't available.", src:"CPG 2.3 pp.42–43"},
      {type:"read", title:"Paediatric changes", pop:"Paediatric arrest", scope:"AP", body:"Start CPR for no signs of life, or for HR <b>&lt;60 with poor perfusion</b> (pallor, mottling, central cyanosis).",
       points:["<b>5 ventilations</b>, then CPR at <b>15:2</b>","Depth at least one-third of the chest (5–6 cm adolescents), 100–120/min; <b>two-thumb encircling</b> for infants &lt;1 year","Adrenaline <b>0.01 mg/kg</b> (max 1 mg; 0.1 ml/kg of 1:10,000): non-shockable as soon as possible; shockable <b>after 4 minutes of CPR</b>; then every 4 minutes","Amiodarone <b>5 mg/kg</b> after the 3rd shock (max 300 mg) and after the 5th (max 150 mg)","Energy <b>4 J/kg</b>. Fluids <b>10 ml/kg × 3</b>. Dextrose 10% <b>2 ml/kg</b>","Ventilation rate with an advanced airway: &lt;1 y 25 · 1–8 y 20 · 8–12 y 15 · &gt;12 y 10 per minute","<b>Trauma (CPG 2.4):</b> no adrenaline until reversible causes and a 10 ml/kg NS bolus; outcome is continue and transport","<span class='badge ccp'>CCP</span> escalate after 5 shocks in 2 J steps to max 8 J/kg; may consider ETI after ~10 min; needle decompression CCP only"], src:"CPG 2.3–2.4 pp.42–49 · Summary p.2"},
      {type:"input", label:"Practice", pop:"Paediatric arrest", scope:"AP", prompt:"The 18 kg child is in asystole. What adrenaline dose do you give?", answer:"0.18", unit:"mg", explain:"0.01 mg/kg × 18 kg = 0.18 mg (1.8 ml of 1:10,000), as soon as possible, then every 4 minutes.", src:"CPG 2.3 p.43"},
      {type:"input", label:"Practice", pop:"Paediatric arrest", scope:"AP", prompt:"Same child: what fluid bolus volume?", answer:"180", unit:"ml", explain:"10 ml/kg × 18 kg = 180 ml, up to 3 times.", src:"CPG 2.3 p.43"},
      {type:"choice", label:"Check", pop:"Paediatric arrest", scope:"AP", prompt:"A child in VF. When is the first adrenaline?",
       options:["After the 2nd shock","After 4 minutes of CPR","Never in shockable rhythms"], answer:1,
       fb:["That was the v2.5 flowchart.",null,"Adrenaline is given in shockable rhythms too."],
       explain:"Shockable: first adrenaline after 4 minutes of CPR, 0.01 mg/kg (max 1 mg), then every 4 minutes.", src:"CPG 2.3 p.43"},

function shuffleOpts(q){
  const idx=q.options.map((_,i)=>i).sort(()=>Math.random()-.5);
  return {...q,options:idx.map(i=>q.options[i]),answer:idx.indexOf(q.answer),fb:q.fb?idx.map(i=>q.fb[i]):undefined};
}
function stepsFor(l){
  if(l.bank==="diag") return DQ.map(q=>({type:"choice",label:"Diagnostic · "+MODS[q.mod],...q}));
  if(l.bank==="all") return QB.map(q=>({type:"choice",label:"Question",...shuffleOpts(q)}));
  if(l.bank) return QB.filter(q=>q.mod===l.bank).map(q=>({type:"choice",label:"Check · "+q.id,...shuffleOpts(q)}));
  return l.steps;
}
const stepCount=l=>l.bank==="diag"?DQ.length:l.bank==="all"?QB.length:l.bank?QB.filter(q=>q.mod===l.bank).length:l.steps.length;

let S=blank();
try{const raw=localStorage.getItem(KEY); if(raw) S={...blank(),...JSON.parse(raw)};}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ymd=d=>d.toLocaleDateString("en-CA");
const today=()=>ymd(new Date());
function liveStreak(){ if(!S.last) return 0; const y=new Date();y.setDate(y.getDate()-1); return (S.last===today()||S.last===ymd(y))?S.streak:0; }

const allLessons=c=>c.units.flatMap(u=>u.lessons);
const courseById=id=>COURSES.find(c=>c.id===id)||COURSES[0];
const lessonById=id=>{for(const c of COURSES){const l=allLessons(c).find(x=>x.id===id);if(l)return {c,l}}return null};
const doneCount=c=>allLessons(c).filter(l=>S.done[l.id]).length;
const courseDone=c=>doneCount(c)===allLessons(c).length;
const nextLesson=c=>allLessons(c).find(l=>!S.done[l.id]);
const reqMet=c=>(c.requires||[]).every(id=>courseDone(courseById(id)));
function isUnlocked(c,l){ if(!reqMet(c)) return false; const ls=allLessons(c);const i=ls.indexOf(l);return i===0||S.done[ls[i-1].id]||S.done[l.id];}
function activeCourse(){ const c=courseById(S.current); if(reqMet(c)&&nextLesson(c)) return c; return COURSES.find(x=>reqMet(x)&&nextLesson(x))||c; }

}

window.addEventListener("message",e=>{
  const f=document.getElementById("simframe");
  if(!f||e.source!==f.contentWindow||!e.data||e.data.type!=="complete")return;
  const record=()=>{let score=null;try{const m=(f.contentDocument.body.innerText||"").match(/Score:\s*(\d+)%/);if(m)score=+m[1];}catch(err){}
    const prev=S.sim&&S.sim.score;S.sim={done:true,date:today(),score:score!=null?(prev!=null?Math.max(prev,score):score):prev??null};save();
    const m=document.getElementById("simmsg");if(m)m.innerHTML=`<div class="simdone" role="status">${I.check}Completion recorded${score!=null?" · score "+score+"%":""}. You can go back to the lesson.</div>`;};
  setTimeout(record,400);
});

const assessMode=()=>P.mode==="diag"||P.mode==="final";

function badges(s){
  const b=[];
  if(s.pop) b.push(`<span class="badge pop">${s.pop}</span>`);
  if(s.scope==="AP") b.push(`<span class="badge ap">AP action</span>`);
  if(s.scope==="CCP") b.push(`<span class="badge ccp">CCP · recognise &amp; escalate</span>`);
  if(s.scope==="verify") b.push(`<span class="badge pend">Scope to verify</span>`);
  if(s.type==="blocked") b.push(`<span class="badge pend">Pending approved source</span>`);
  if(s.id&&CRITICAL.includes(s.id)&&P.mode!=="final") b.push(`<span class="badge crit">Critical item</span>`);
  return b.length?`<div class="badges">${b.join("")}</div>`:"";
}
const pendingBox=list=>list&&list.length?`<div class="pending"><b>Pending verification</b><ul>${list.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:"";
const srcLine=s=>s.src&&!assessMode()?`<div class="src">Source: ${s.src}</div>`:"";
const locked=()=>P.status==="right"||P.status==="revealed";

function stepBody(s){
  const lab=s.label?`<span class="label">${s.label}</span>`:"";
  if(s.type==="read") return `${badges(s)}<h2>${s.title}</h2><p>${s.body}</p>${s.points?`<ul>${s.points.map(p=>`<li>${p}</li>`).join("")}</ul>`:""}${s.visual?`<div class="visual">${V[s.visual]}</div>`:""}${pendingBox(s.pending)}${srcLine(s)}`;
  if(s.type==="choice") return `${badges(s)}${lab}<h2>${s.prompt}</h2>${s.visual?`<div class="visual">${V[s.visual]}</div>`:""}<div class="opts" role="radiogroup" aria-label="Answer options">${s.options.map((o,i)=>{
      let cls="";if(locked()&&i===s.answer)cls="right";else if(P.status==="wrong"&&i===P.sel)cls="wrong";
      return `<button class="opt ${cls}" role="radio" aria-checked="${P.sel===i}" data-opt="${i}" ${locked()?"disabled":""}><span class="k">${String.fromCharCode(65+i)}</span>${o}</button>`}).join("")}</div>${srcLine(s)}`;
  if(s.type==="multi") return `${badges(s)}${lab}<h2>${s.prompt}</h2><p class="note">Select all that apply.</p><div class="opts">${s.options.map((o,i)=>{
      const on=P.multi.includes(i),inKey=s.answer.includes(i);let cls="";
      if(locked()) cls=inKey?"right":""; else if(P.status==="wrong"&&on!==inKey) cls="wrong";
      return `<button class="opt ${cls}" role="checkbox" aria-checked="${locked()?inKey:on}" data-multi="${i}" ${locked()?"disabled":""}><span class="k">${(locked()?inKey:on)?I.check:""}</span>${o}</button>`}).join("")}</div>${srcLine(s)}`;
  if(s.type==="sort") return `${badges(s)}${lab}<h2>${s.prompt}</h2><div class="sort">${s.cards.map((cd,ci)=>{

function walkPick(i){

const QTYPES=["choice","multi","sort","input"];

function isReady(s){

  if(s.type==="walk") return s.nodes[P.cur||s.start].end?`<button class="btn wide" data-act="next">Continue</button>`:`<button class="btn wide" disabled>Work through the algorithm to continue</button>`;

    return `${conf}<button class="btn wide" data-act="check" ${canCheck(s)?"":"disabled"}>${assessMode()?"Submit answer":"Check"}</button>`;}

  if(P.status==="wrong") return `<div class="fb"><h3>Not quite</h3><p>${fbText}</p>${confNote(false)}</div><div class="foot-btns"><button class="btn ghost" data-act="reveal">Show answer</button><button class="btn bad" data-act="retry">Try again</button></div>`;

function drawPlayer(keepFocus){

function evaluate(s){
  if(s.type==="choice") return P.sel===s.answer;
  if(s.type==="multi") return P.multi.length===s.answer.length&&s.answer.every(i=>P.multi.includes(i));
  if(s.type==="sort") return s.cards.every((cd,ci)=>P.sort[ci]===cd.b);

function check(){

function tally(answers){

function finishLesson(){

function revisitButtons(lessonIds){

     ${R.crit.length?`<div class="resrow"><b style="color:var(--bad)">Critical items missed</b><small class="no">${R.crit.join(", ")}</small>${revisitButtons(P.answers.filter(a=>R.crit.includes(a.id)).map(a=>a.lesson))}</div>`:""}${cwRow()}</div>

}

/* ============================ TXA HANDS-ON (native, immersive) ============================

   <input type="range" id="txrange" min="0" max="${max}" step="0.1" value="${P.sx.v}" aria-label="Pull the syringe plunger">
   <button class="iconbtn" data-tx="nudge" data-d="0.1" aria-label="Nudge plus 0.1 mL">+</button></div>
   <p class="note" style="text-align:center">Drag the plunger, use the slider, or nudge 0.1 mL at a time.</p>`;
}
function txSetV(v,limit){
  const st=P.sx;limit=limit??(st.rig?st.rig.max:st.cap);v=Math.max(0,Math.min(limit,Math.round(v*10)/10));
  if(Math.floor(v)!==Math.floor(st.v)){txSound("click");try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}}
  st.v=v;txRigUpdate(st);
  TXS[st.key].onV&&TXS[st.key].onV(st,v);
}
function txBindSyringe(limitFn){
  const svg=document.getElementById("txsyr");if(!svg)return;
  const st=P.sx,toV=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*640;return (x-48)/260*st.cap;};
  let drag=false;
  svg.addEventListener("pointerdown",e=>{drag=true;try{svg.setPointerCapture(e.pointerId)}catch(_){}txSetV(toV(e),limitFn&&limitFn());});
  svg.addEventListener("pointermove",e=>{if(drag)txSetV(toV(e),limitFn&&limitFn());});
  ["pointerup","pointercancel"].forEach(k=>svg.addEventListener(k,()=>drag=false));
  const r=document.getElementById("txrange");
  if(r){r.addEventListener("input",()=>txSetV(Number(r.value),limitFn&&limitFn()));}
}
function txChartHTML(st,c){
  const mask=true,sel=st.row;
  const cell=v=>mask?`<span class="q">?</span>`:v;
  const tr=(r,label,w)=>{const id=r.infant?"0":String(r.age);return `<tr class="${sel===id?"sel":""}"><td><button class="rowbtn" data-tx="row" data-row="${id}" ${st.phase!=="row"?"disabled":""} aria-label="${label} row">${label}</button></td><td>${w}</td><td>${cell(r.dose+" mg")}</td><td>${cell(r.volume+" mL")}</td><td>${r.drawOut?`<span class="out">Draw out ${r.drawOut} mL</span>`:"–"}</td></tr>`;};
  return `<div class="visual"><table class="txc"><thead><tr><th>Age</th><th>Est. weight</th><th>Dose (15 mg/kg)</th><th>Volume (10 mg/mL)</th><th>≥8 years</th></tr></thead><tbody>
   ${tr({infant:true,dose:"?",volume:"?"},"0–12 months","(months × 0.5) + 4")}
   ${TX_CHART.filter(r=>r.age<8).map(r=>tr(r,r.age+" y",r.weight+" kg")).join("")}
   <tr class="band"><td colspan="5"><b>≥8 years or &gt;30 kg:</b> add 1 g, draw out and discard the volume shown, give the remaining volume over 10 minutes (includes 10 mL administration-set compensation).</td></tr>
   ${TX_CHART.filter(r=>r.age>=8).map(r=>tr(r,r.age+" y",r.weight+" kg")).join("")}
  </tbody></table></div>`;
}

const BAGP="M30 32 Q30 14 48 14 H172 Q190 14 190 32 V220 Q190 238 172 238 H48 Q30 238 30 220 Z";
function txRigSVG(st,o){

  if(o.mode!=="needle"){
    const bv=o.bagOf(v),ly=RIG.bagBottom-bv*RIG.bagScale,lab=o.label;
    let ticks="";for(let m=20;m<=100;m+=10){const y=RIG.bagBottom-m*RIG.bagScale;ticks+=`<line x1="176" x2="${m%50?183:188}" y1="${y}" y2="${y}" stroke="#4A5878" stroke-width="1.2"/><text x="173" y="${y+3}" font-size="7" text-anchor="end" fill="#4A5878">${m}</text>`;}
    g+=`<defs><clipPath id="rigbag"><path d="${BAGP}"/></clipPath></defs>
     <path d="${BAGP}" fill="rgba(226,236,248,.65)" stroke="#8EA3C0" stroke-width="1.6"/>
     <rect id="rig-bagfl" x="30" y="${ly}" width="160" height="${240-ly}" fill="${o.fluid==="txa"&&o.label?"#B9D6FA":"#A9CCF3"}" opacity=".75" clip-path="url(#rigbag)"/>
     ${o.streakOf?`<g id="rig-streak" opacity="${o.streakOf(v)}" clip-path="url(#rigbag)" fill="none" stroke="#2F6FD8" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 5"><path d="M110 238 C94 205 128 178 104 140"/><path d="M110 238 C126 210 92 186 118 152"/><path d="M110 238 C104 214 122 200 98 172"/></g>`:""}
     <ellipse cx="110" cy="26" rx="13" ry="6" fill="#fff" stroke="#8EA3C0"/>
     <text x="96" y="56" font-size="10" font-weight="700" text-anchor="middle" fill="#1E2A44">0.9% Sodium Chloride</text>
     <text x="96" y="68" font-size="6.5" text-anchor="middle" fill="#3A4766">Intravenous Infusion BP</text>
     <text x="96" y="86" font-size="13" font-weight="800" text-anchor="middle" fill="#1E2A44">100 mL</text>
     ${ticks}
     ${lab?`<g><rect x="46" y="104" width="118" height="62" rx="3" fill="#fff" stroke="#C9CFDA"/><rect x="46" y="104" width="118" height="9" fill="#D03A43"/><text x="105" y="111" font-size="6.5" font-weight="800" text-anchor="middle" fill="#fff">TRANEXAMIC ACID</text>
       <text x="105" y="133" font-size="16" text-anchor="middle" fill="#1D3B8A" font-family="Caveat,cursive">${txEsc(lab.conc||"10")} mg/mL</text><text x="105" y="150" font-size="10" text-anchor="middle" fill="#1D3B8A" font-family="Caveat,cursive">${txEsc(lab.date||"")} ${txEsc(lab.time||"")}</text><text x="105" y="161" font-size="10" text-anchor="middle" fill="#1D3B8A" font-family="Caveat,cursive">${txEsc(lab.weight||"")} kg</text></g>`:""}
     <rect x="64" y="238" width="16" height="22" rx="3" fill="#EEF2F8" stroke="#9AA9C2"/>
     <rect x="102" y="238" width="16" height="24" rx="2" fill="#EEF2F8" stroke="#9AA9C2"/><rect x="100" y="246" width="20" height="6" rx="2" fill="#2A6BE0"/>
     <rect x="106" y="252" width="8" height="12" fill="${fl}"/>`;
  } else {
    const amp=(i,cx)=>{const rem=st.rem[i],act=st.amp===i,h=rem/5*92;return `<g><path d="M${cx-15} 118 Q${cx-15} 106 ${cx-8} 102 L${cx-8} 84 L${cx+8} 84 L${cx+8} 102 Q${cx+15} 106 ${cx+15} 118 L${cx+15} 206 Q${cx+15} 212 ${cx+9} 212 L${cx-9} 212 Q${cx-15} 212 ${cx-15} 206Z" fill="rgba(226,236,248,.7)" stroke="${act?"#2F5BFF":"#8EA3C0"}" stroke-width="${act?2.4:1.4}"/>
      <rect id="rig-a${i}" x="${cx-14}" y="${210-h}" width="28" height="${h}" fill="#B9D6FA"/><rect x="${cx-15}" y="150" width="30" height="20" fill="#fff" opacity=".9"/><text x="${cx}" y="160" font-size="5.5" text-anchor="middle" fill="#1E2A44">TXA</text><text x="${cx}" y="167" font-size="5" text-anchor="middle" fill="#1E2A44">500 mg/5 mL</text>
      <text x="${cx}" y="232" font-size="9" text-anchor="middle" font-weight="700" fill="${act?"#2F5BFF":"#4A5878"}">Ampoule ${i+1}</text></g>`;};
    const ax=st.amp===0?62:158;
    g+=`${amp(0,62)}${amp(1,158)}<line x1="110" y1="262" x2="${ax}" y2="196" stroke="#8F98AA" stroke-width="2"/><circle cx="${ax}" cy="196" r="2" fill="#8F98AA"/>`;
  }
  let ticks="";for(let i=0;i<=50;i++){const y=RIG.top+i*RIG.ml,maj=i%10===0,mid=i%5===0;ticks+=`<line x1="82" x2="${82+(maj?22:mid?15:9)}" y1="${y}" y2="${y}" stroke="#11151F" stroke-width="${maj?1.6:1}"/>`;if(maj&&i)ticks+=`<text x="108" y="${y+4}" font-size="11" font-weight="700" fill="#11151F">${i}</text>`;}
  const tgt=guided&&o.target!=null&&o.target>0?`<path d="M141 ${RIG.top+o.target*RIG.ml} l9 -5 v10z" fill="#2F5BFF"/>`:"";
  g+=`<rect x="104" y="262" width="12" height="30" rx="2" fill="#E7EBF2" stroke="#9AA9C2"/><rect x="96" y="290" width="28" height="12" rx="3" fill="#E7EBF2" stroke="#9AA9C2"/>
   <rect x="82" y="302" width="56" height="250" rx="5" fill="rgba(232,239,247,.75)"/>

     <rect x="83" y="302" width="54" height="14" rx="3" fill="#2B2F3A"/><line x1="85" x2="135" y1="307" y2="307" stroke="#4A4F5C"/><line x1="85" x2="135" y1="311" y2="311" stroke="#4A4F5C"/>
     <rect x="72" y="584" width="76" height="13" rx="6" fill="#E9ECF2" stroke="#AEB7C8"/></g>
   <rect x="82" y="302" width="56" height="250" rx="5" fill="none" stroke="#8193AE" stroke-width="1.6"/><rect x="128" y="306" width="4" height="242" rx="2" fill="#fff" opacity=".6"/>
   ${ticks}${tgt}
   <rect x="54" y="552" width="112" height="11" rx="5" fill="#E2E7EF" stroke="#9AA9C2"/>`;
  return `<svg class="rig2" id="txrig" viewBox="0 0 220 ${RIG.H}" tabindex="0" role="slider" aria-label="${o.push?"Syringe plunger: push up to inject":"Syringe plunger: drag down to draw"}" aria-valuemin="0" aria-valuemax="${o.max}" aria-valuenow="${v}" ${guided?`aria-valuetext="${v.toFixed(1)} mL"`:""}>${g}</svg>`;
}
function txLoupe(v,o){
  const f=o.fluid==="txa"?"#B9D6FA":"#9EC3F2";let t="";
  for(let i=Math.floor(v)-4;i<=Math.ceil(v)+4;i++){if(i<0||i>50)continue;const y=60+(i-v)*16,L=i%10===0?42:i%5===0?30:18;
    t+=`<line x1="14" x2="${14+L}" y1="${y}" y2="${y}" stroke="#0B0E16" stroke-width="${i%5===0?2.4:1.4}"/>`;if(i%5===0)t+=`<text x="${20+L}" y="${y+5}" font-size="14" font-weight="800" fill="#0B0E16">${i}</text>`;}
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><defs><clipPath id="lpc"><circle cx="60" cy="60" r="55"/></clipPath></defs><g clip-path="url(#lpc)"><rect width="120" height="120" fill="#EEF3FA"/><rect width="120" height="60" fill="${f}"/><rect y="60" width="120" height="60" fill="#7B8190"/>${t}<path d="M118 60 l-9 -6 v12z" fill="#2F5BFF"/></g><circle cx="60" cy="60" r="55" fill="none" stroke="#8C99B5" stroke-width="3"/></svg>`;
}
function txGaugeHTML(gs){ return `<div class="gbar"><span class="gz" style="left:${gs.zone??47}%"></span><i style="left:${Math.max(0,Math.min(100,gs.pct))}%"></i></div><p class="${gs.ok?"gok":""}">${gs.t}</p>`; }
function txBench(st,o){
  st.rig=o;if(st.vr==null)st.vr=st.v;const guided=P.txMode==="guided";
  return `<div class="bench"><div class="rigcard">${txRigSVG(st,o)}</div>
   <div class="benchside">
    ${guided?`<div class="readout2"><span class="label">Syringe</span><b id="txsv">${st.v.toFixed(1)} mL</b>${o.mg?`<span id="txmg">${o.mg(st.v)}</span>`:""}${o.mode!=="needle"?`<span id="txbag">Bag ${o.bagOf(st.v).toFixed(1)} mL</span>`:""}</div>`:`<p class="note">Read the volume on the syringe scale. The magnifier shows the edge of the plunger.</p>`}
    ${guided&&o.gauge?`<div class="gauge" id="txgauge">${txGaugeHTML(o.gauge(st.v))}</div>`:""}
    <div class="loupe"><span class="label">Magnifier</span><div id="txloupe">${txLoupe(st.v,o)}</div></div>
    <p class="note">${o.push?"Drag the plunger <b>up</b> to push.":"Drag the plunger <b>down</b> to draw."} Keyboard: focus the syringe and use the arrow keys.</p>
    <button class="btn ghost sm" data-tx="fine" style="justify-self:start">${st.fine?"Hide fine adjust":"Fine adjust"}</button>
    ${st.fine?txSyrControls(o.max):""}
   </div></div>`;
}
function txRigUpdate(st){
  const o=st.rig;if(!o)return;const v=st.v,guided=P.txMode==="guided",$=id=>document.getElementById(id);
  const fl=$("rig-fl");if(fl)fl.setAttribute("height",v*RIG.ml);
  const pl=$("rig-pl");if(pl)pl.setAttribute("transform",`translate(0 ${v*RIG.ml})`);
  if(o.mode!=="needle"){const bv=o.bagOf(v),ly=RIG.bagBottom-bv*RIG.bagScale,b=$("rig-bagfl");if(b){b.setAttribute("y",ly);b.setAttribute("height",240-ly);}
    const ch=$("txbag");if(ch)ch.textContent=`Bag ${bv.toFixed(1)} mL`;const sk=$("rig-streak");if(sk&&o.streakOf)sk.setAttribute("opacity",o.streakOf(v));}
  const svg=$("txrig");if(svg){svg.setAttribute("aria-valuenow",v);if(guided)svg.setAttribute("aria-valuetext",v.toFixed(1)+" mL");}
  const sv=$("txsv");if(sv)sv.textContent=v.toFixed(1)+" mL";const mg=$("txmg");if(mg&&o.mg)mg.innerHTML=o.mg(v);
  const ga=$("txgauge");if(ga&&o.gauge)ga.innerHTML=txGaugeHTML(o.gauge(v));
  const lp=$("txloupe");if(lp)lp.innerHTML=txLoupe(v,o);
  const r=$("txrange");if(r&&document.activeElement!==r)r.value=v;
  const cf=$("txconfirm");if(cf){cf.textContent=st.confirmLabel?st.confirmLabel(v):(guided?`Confirm ${v.toFixed(1)} mL`:"Confirm volume");cf.disabled=st.confirmDisabled?st.confirmDisabled(v):false;}
}
function txBindRig(limitFn){
  const svg=document.getElementById("txrig");if(!svg)return;const st=P.sx;let lastY=null;
  const sy=e=>{const r=svg.getBoundingClientRect();return (e.clientY-r.top)/r.height*RIG.H;};
  const lim=()=>limitFn?limitFn():st.rig.max;
  svg.addEventListener("pointerdown",e=>{lastY=sy(e);st.vr=st.v;try{svg.setPointerCapture(e.pointerId)}catch(_){}});
  svg.addEventListener("pointermove",e=>{if(lastY==null)return;const y=sy(e);let dv=(y-lastY)/RIG.ml;lastY=y;const o=st.rig;
    if(P.txMode==="guided"&&o.target!=null&&o.target>0&&Math.abs(st.v-o.target)<1.5)dv*=.35;
    st.vr=Math.max(0,Math.min(lim(),st.vr+dv));txSetV(st.vr,lim());});
  ["pointerup","pointercancel"].forEach(k=>svg.addEventListener(k,()=>lastY=null));
  svg.addEventListener("keydown",e=>{const m={ArrowDown:.1,ArrowRight:.1,ArrowUp:-.1,ArrowLeft:-.1,PageDown:1,PageUp:-1}[e.key];if(m==null)return;e.preventDefault();txSetV(st.v+m,lim());st.vr=st.v;});
  const r=document.getElementById("txrange");if(r)r.addEventListener("input",()=>{txSetV(Number(r.value),lim());st.vr=st.v;});
}

  after:(st)=>{const z=document.getElementById("txmix"),bag=document.getElementById("txmixbag");if(!z)return;let last=null;
   const ang=e=>{const r=z.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI;};
   z.addEventListener("pointerdown",e=>{try{z.setPointerCapture(e.pointerId)}catch(_){}last={a:ang(e),t:performance.now()};});
   z.addEventListener("pointermove",e=>{if(!last)return;const a=ang(e);let d=a-last.a;if(d>180)d-=360;if(d<-180)d+=360;const now=performance.now(),dt=Math.max(1,now-last.t);last={a,t:now};
    if(Math.abs(d)/dt>1.6&&(!st.shookAt||now-st.shookAt>1500)){st.shookAt=now;st.froth=true;
      if(P.txMode==="guided"){last=null;txErr("Shook the bag vigorously","Turn the bag slowly and gently. Do not shake.","Vigorous shaking froths the solution and puts air bubbles into the bag and line.");return;}

   ["pointerup","pointercancel"].forEach(k=>z.addEventListener(k,()=>last=null));}},

const thExpected=(item,step)=>item.action===({dry:'towel',temp1:'temperature',temp2:'temperature'}[step.key]||step.key);
function thReason(item,step){
  if(item.id==='used-towel') return 'This towel has already been used for drying. It is not the remaining dry towel in this activity.';
  if(['worn-cap','applied-towel','applied-thermal','cord'].includes(item.id)) return 'This item is already in place. Select the next action in the pathway.';
  if(item.id==='ac'||item.id==='remote') return step.key==='door'||step.key==='temp2'?'The air conditioner is already off. This action is complete.':'Changing the air conditioner is not the next action in this activity.';
  if(item.id==='door') return step.key==='temp2'?'The door is already closed. This action is complete.':'Closing the door comes after turning off the air conditioner in this activity.';
  if(item.action==='temperature') return 'A temperature check is not due at this point in the activity. Complete the preceding care steps first.';
  if(item.action==='cap') return 'Covering the head comes after drying in this activity.';
  if(item.action==='towel') return 'The next towel is for wrapping, which comes after covering the head in this activity.';
  if(item.action==='thermal') return 'Thermal protection comes after the dry-towel wrap in this activity.';
  if(item.id==='newborn') return 'Select the equipment or environmental control for the next action, rather than the newborn.';

function rxTrace(type,rate=75){
  const W=300,B=48;
  const seg=o=>{let d="",x=0;const X=v=>(v+o).toFixed(1);
    if(type==="VF"){const amps=[18,26,14,22,30,12,20,27,16,24,19,25];let i=0;while(x<W-1){const w=Math.min(12+((i*5)%7),(W-x)/2),a=amps[i%amps.length];d+=` Q${X(x+w/2)} ${B-a} ${X(x+w)} ${B} Q${X(x+w*1.5)} ${B+a*.8} ${X(x+w*2)} ${B}`;x+=w*2;i++;}}
    else if(type==="cpr"){const sp=Math.round(100*60/110);while(x+sp<=W+.1){d+=` Q${X(x+sp*.25)} ${B-26} ${X(x+sp*.5)} ${B} Q${X(x+sp*.75)} ${B+10} ${X(x+sp)} ${B}`;x+=sp;}d+=` L${X(W)} ${B}`;}
    else if(type==="sin"){const sp=Math.max(30,W/Math.max(1,Math.round(W/(100*60/rate))));while(x+sp<=W+.1){const p=x+sp*.15;d+=` L${X(p)} ${B} Q${X(p+5)} ${B-6} ${X(p+10)} ${B} L${X(p+16)} ${B} L${X(p+19)} ${B+5} L${X(p+23)} ${B-34} L${X(p+27)} ${B+9} L${X(p+30)} ${B} L${X(p+42)} ${B} Q${X(p+52)} ${B-11} ${X(p+62)} ${B}`;x+=sp;}d+=` L${X(W)} ${B}`;}
    else if(type==="pleth"){const sp=Math.max(30,W/Math.max(1,Math.round(W/(100*60/rate))));while(x+sp<=W+.1){d+=` L${X(x+sp*.2)} ${B+14} Q${X(x+sp*.32)} ${B-26} ${X(x+sp*.48)} ${B-8} Q${X(x+sp*.6)} ${B-2} ${X(x+sp*.7)} ${B+4} L${X(x+sp)} ${B+14}`;x+=sp;}d+=` L${X(W)} ${B+14}`;}
    else d+=` L${X(W)} ${B}`;
    return d;};
  const y0=type==="pleth"?B+14:B;
  return `<svg viewBox="0 0 ${W} 80" preserveAspectRatio="none" aria-hidden="true"><g class="trk"><path d="M0 ${y0}${seg(0)}${seg(W)}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></g></svg>`;
}

function ccDue(c,st){
  const d=[];const adrGap=st.lastAdr==null||st.cyc-st.lastAdr>=2;
  if(c.pop==="trauma"){ if(st.fluid>=500&&st.hott.length===4&&adrGap) d.push("adr"); }
  else if(c.pop==="paed"){ if(st.cyc>=3&&adrGap) d.push("adr"); }
  else { if(st.shocks>=3&&adrGap) d.push("adr"); }
  if(c.pop!=="trauma"){ if(st.shocks>=3&&!st.amio1) d.push("amio1"); else if(st.shocks>=5&&st.amio1&&!st.amio2) d.push("amio2"); }
  return d.filter(x=>!st.given.includes(x));
}
const CC_HOTT=[["h","Hypovolaemia: control bleeding, give fluid"],["o","Oxygenation: airway and ventilation"],["t1","Tension pneumothorax: assess, CCP to decompress"],["t2","Tamponade: assess and escalate"]];
TXS.ccloop={phases:["start","check","defib","cpr"],init:(st,c)=>{st.tag="ccloop";st.rx=1;st.cyc=1;st.shocks=0;st.lastAdr=null;st.amio1=false;st.amio2=false;st.given=[];st.fluid=0;st.hott=[];st.energy=c.pop==="paed"?50:150;st.charged=false;st.log=[];if(c.pop==="adult")st.phase="check";},
  guide:s=>P.txMode!=="guided"?[["neutral","Run the arrest. Rhythm checks every 2 minutes."]]:(s.variant==="trauma"?[["thinking","Adult trauma arrest after a collision. Work on HOTT while CPR continues. Adrenaline is locked until the reversible causes and at least 500 ml of saline are done."]]:s.variant==="paed"?[["thinking","Child in cardiac arrest, 15 kg. Start the paediatric way, then dose everything by weight."]]:[["thinking","Adult medical arrest. Every rhythm check, decide. Then give drugs exactly when they're due and continue CPR."]]),
  hint:(c,st)=>{
   if(st.phase==="start") return c.pop==="paed"?"Paediatric CPR starts with 5 ventilations, then 15:2.":"Treat HOTT simultaneously with compressions.";
   if(st.phase==="check"){const r=c.rh[st.cyc-1];return r==="VF"?"VF is shockable.":r==="PEA"||r==="ROSC"?"An organised rhythm: check for a pulse.":"";}
   if(st.phase==="defib") return c.pop==="paed"?`4 J/kg × ${c.w} kg.`:`${c.device}: ${CC_EN[c.device].join(", ")} J for shocks 1, 2, 3+.`;
   const d=ccDue(c,st);return d.length?"Due now: "+d.map(x=>({adr:"adrenaline",amio1:"first amiodarone",amio2:"second amiodarone"}[x])).join(" and ")+".":(c.pop==="trauma"&&st.fluid<500?"Adrenaline is locked: HOTT and at least 500 ml first.":"Nothing is due this cycle. Continue CPR.");},
  body:(st,c)=>{
   const r=c.rh[st.cyc-1],cpr=st.phase==="cpr"||st.phase==="start";
   const rhythm=cpr?"cpr":(r==="VF"?"VF":"sin"),rate=r==="PEA"?48:r==="ROSC"?92:60;
   const mon=rxMonitor({rhythm,rate,hr:cpr?"CPR":r==="VF"?"---":rate,co2:cpr?(r==="ROSC"?38:22):null,energy:st.phase==="defib"?st.energy:null,clock:ccClock(st),aria:cpr?"CPR in progress":"Rhythm check",status:cpr?"<b>CPR in progress</b> · compressions 100–120/min":`<b>Rhythm check ${st.cyc}</b> · pause under 5 s`});
   const strip=`<div class="ccstrip"><span>Shocks <b>${st.shocks}</b></span><span>Adrenaline <b>${st.log.filter(x=>x.startsWith("Adr")).length}</b></span>${c.pop!=="trauma"?`<span>Amiodarone <b>${(st.amio1?1:0)+(st.amio2?1:0)}</b></span>`:`<span>Fluid <b>${st.fluid} ml</b></span>`}<span>Device <b>${c.device}</b></span></div>`;
   if(st.phase==="start") return mon+strip+rxHead(c.pop==="paed"?"How does CPR start for this child?":"Trauma arrest. How do you work?")+rxOpts("ccstart",c.pop==="paed"?["5 ventilations, then CPR at 15:2","30:2 straight away","Compressions only until the pads are on"]:["Treat HOTT at the same time as compressions; keep scene time to a minimum","Give adrenaline first, then look for causes","Run the adult medical algorithm unchanged"]);
   if(st.phase==="check") return mon+strip+rxHead(`Rhythm check ${st.cyc}. What do you do?`)+rxOpts("cccheck",["Shockable: charge and shock","Non-shockable: resume CPR","Organised rhythm: check for a pulse"]);
   if(st.phase==="defib"){const paed=c.pop==="paed";return mon+strip+rxHead(paed?`Set the energy for ${c.w} kg`:`Shock ${st.shocks+1}: set the energy on the ${c.device}`)+`<div class="stp" style="max-width:360px;margin:0 auto"><span class="label">Energy</span>${paed?`<div><button class="iconbtn" data-tx="ccen" data-d="-10" aria-label="Lower energy">−</button><output aria-live="polite">${st.energy} J</output><button class="iconbtn" data-tx="ccen" data-d="10" aria-label="Raise energy">+</button></div>`:`<div class="seg">${[120,150,200,300,360].map(v=>`<button class="segb" data-tx="ccenv" data-v="${v}" aria-pressed="${st.energy===v}">${v}</button>`).join("")}</div>`}</div>
     <div class="rxbtns"><button class="btn big ${st.charged?"ghost":""}" data-tx="cccharge" ${st.charged?"disabled":""}>${st.charged?"Charged ✓":"Charge"}</button><button class="btn big shock" data-tx="ccshock" ${st.charged?"":"disabled"}>⚡ Shock</button></div><p class="note" style="text-align:center">Compressions continue while charging. Everyone clear before the shock.</p>`;}
   const paed=c.pop==="paed",aD=Math.min(+(c.w*.01).toFixed(2),1),mD=Math.min(c.w*5,st.amio1?150:300);
   const drugs=c.pop==="trauma"?`<div class="ccdrugs"><div class="hottl"><span class="label">HOTT</span>${CC_HOTT.map(([k,t])=>`<button class="tog" data-tx="cchott" data-k="${k}" aria-pressed="${st.hott.includes(k)}"><i>${st.hott.includes(k)?I.check:""}</i>${t}</button>`).join("")}</div>
      <div class="rxbtns"><button class="btn ghost" data-tx="ccfluid">+250 ml normal saline</button><button class="btn ghost" data-tx="ccadr">Adrenaline 1 mg</button></div></div>`
    :paed?`<div class="ccdrugs paed"><div class="drow"><label for="ccadrin">Adrenaline</label><input id="ccadrin" inputmode="decimal" autocomplete="off"><span class="unit">mg</span><button class="btn ghost sm" data-tx="ccadr">Give</button></div><div class="drow"><label for="ccamin">Amiodarone</label><input id="ccamin" inputmode="decimal" autocomplete="off"><span class="unit">mg</span><button class="btn ghost sm" data-tx="ccamio">Give</button></div></div>`
    :`<div class="rxbtns"><button class="btn ghost" data-tx="ccadr">Adrenaline 1 mg</button><button class="btn ghost" data-tx="ccamio" data-v="300">Amiodarone 300 mg</button><button class="btn ghost" data-tx="ccamio" data-v="150">Amiodarone 150 mg</button></div>`;
   return mon+strip+rxHead(`Cycle ${st.cyc}: 2 minutes of CPR`,"Give anything that's due now, then continue CPR.")+drugs+(st.log.length?`<p class="note" style="text-align:center">Given: ${st.log.join(" · ")}</p>`:"");},
  foot:st=>st.phase==="cpr"?`<button class="btn wide" data-tx="cccont">Continue CPR · next rhythm check</button>`:""};

TXS.ccrosc={phases:["o2","bp"],init:(st,c)=>{st.tag="ccrosc";st.rx=1;st.fi=15;},
  guide:rxG([["happy","ROSC. Now protect the brain: titrate oxygen to the target, then support the blood pressure."]],"ROSC achieved."),
  hint:(c,st)=>st.phase==="o2"?"Target SpO₂ 94–98%. Turn the flow down until you're in range, then confirm.":c.pop==="paed"?"Paediatric boluses are 10 ml/kg.":"Adults: 250 ml boluses.",
  body:(st,c)=>{
   const STEPS=[0,1,2,3,4,5,6,7,9,12,15,25],spo=st.fi>=6?100:[88,92,94,96,97,98][st.fi]??100;st.spo=spo;
   if(st.phase==="o2"){const ang={0:90,1:62,2:34,3:3,4:-24,5:-50,6:-90,7:-118,9:-148,12:180,15:150,25:122}[st.fi]*Math.PI/180;
    return rxMonitor({rhythm:"sin",rate:96,hr:96,spo,co2:42,bp:c.pop==="paed"?"72/40":"84/50",aria:`SpO2 ${spo}%`,status:"ROSC · ventilated with oxygen"})+rxHead(`SpO₂ ${spo}%. Titrate the oxygen.`,"Target 94–98%. Avoid hyperoxaemia.")+`<div class="split"><div class="rxphoto flow"><img src="${RXM("flowmeter")}" alt="Oxygen flowmeter dial"><span class="fdot" style="left:${46.4+Math.cos(ang)*17.5}%;top:${54.8+Math.sin(ang)*19.5}%"></span></div>
     <div class="thtemp"><div class="stp"><span class="label">Oxygen flow</span><div><button class="iconbtn" data-tx="ccfi" data-d="-1" aria-label="Lower flow">−</button><output aria-live="polite">${st.fi} L/min</output><button class="iconbtn" data-tx="ccfi" data-d="1" aria-label="Raise flow">+</button></div></div><div class="readout2"><span class="label">SpO₂</span><b>${spo}%</b><span>${spo>98?"Too high: hyperoxaemia":spo<94?"Too low":"In target range"}</span></div></div></div>`;}
   const tgt=c.pop==="paed"?`SBP target (age × 2) + 70 = ${c.age*2+70} mmHg`:"Target SBP >90 or MAP >65 mmHg";
   return rxMonitor({rhythm:"sin",rate:96,hr:96,spo:96,co2:40,bp:c.pop==="paed"?"66/38":"82/48",aria:"Hypotensive",status:tgt})+rxHead("Hypotensive after ROSC. Which fluid bolus?")+rxOpts("ccbp",c.pop==="paed"?[`10 ml/kg: ${c.w*10} ml`,`20 ml/kg: ${c.w*20} ml`,"No fluid: start an adrenaline infusion yourself"]:["250 ml bolus, reassess","2 L wide open","No fluid: SBP 82 is acceptable"]);}
};

const ICEZ=[{id:"rax",label:"Right axilla",z:[8,34,16,14],ok:1},{id:"lax",label:"Left axilla",z:[76,34,16,14],ok:1},{id:"groin",label:"Groin",z:[36,86,28,10],ok:1},{id:"head",label:"Forehead",z:[40,2,20,10]},{id:"neck",label:"Neck",z:[42,20,16,8]},{id:"chest",label:"Centre of the chest",z:[38,38,24,18]}];
TXS.ccice={phases:["decide","place","temp"],init:st=>{st.tag="ccice";st.rx=1;st.ice=[];},
  guide:rxG([["thinking","Your patient had a medical arrest, has ROSC and is still comatose, GCS 3. Decide about cooling."]],"Post-ROSC. Decide about cooling."),
  hint:(c,st)=>st.phase==="decide"?"Ice-pack cooling is for comatose adults after a medical arrest.":st.phase==="place"?"Axillae and groin.":"Don't let the temperature fall below 33 °C, and tell the hospital.",
  body:(st,c)=>{
   if(st.phase==="decide") return rxHead(`${c.label}. ROSC, GCS 3. Start ice-pack cooling?`)+rxOpts("ccicey",["Yes: comatose adult after a medical arrest","No: cooling isn't indicated for this patient"]);
   if(st.phase==="place") return rxHead("Place the ice packs",`Tap each correct position. <b>${st.ice.length}</b> of 3 placed.`)+`<div class="split"><div>${rxBody("front",ICEZ.filter(z=>!st.ice.includes(z.id)),ICEZ.filter(z=>st.ice.includes(z.id)).map(z=>({z:z.z,cls:"icep"})),st,"ccicez","Front")}</div><div class="rxphoto"><img src="${RXM("icepack")}" alt="Instant ice pack"><p class="note">Activate each pack and wrap it in a cloth barrier.</p></div></div>`;
   return rxMonitor({rhythm:"sin",rate:84,hr:84,spo:96,co2:40,bp:"104/62",aria:"Temperature 33.2",status:"Core temperature <b>33.2 °C</b> and falling"})+rxHead("Temperature 33.2 °C and falling. What do you do?")+rxOpts("cctemp",["Remove the ice packs so it doesn't fall below 33 °C, and update the hospital on the cooling","Keep cooling: lower is better","Add more ice packs to the chest"]);}
};

/* ====================== ON THE STRETCHER (SMR) ====================== */
TXS.smr={phases:["board","blocks","secure","angle"],init:(st,c)=>{st.tag="smr";st.rx=1;st.ang=0;},
  guide:s=>P.txMode==="guided"?[["thinking",s.variant==="unc"?"Unconscious motorcyclist, GCS 6, extricated on the combi-carrier and now on the stretcher.":"Alert driver, GCS 15, neck pain. Self-extricated to the stretcher via the combi-carrier. She's distressed lying flat on the board."]]:null,
  hint:(c,st)=>({board:c.conscious?"Consider removing the board once on the stretcher, particularly if it's causing distress.":"Keep the unconscious trauma patient on the combi-carrier.",blocks:"Head blocks apply on the board or on the stretcher.",secure:"On the board: spider harness plus stretcher straps. Off the board: stretcher straps.",angle:"Up to 30° if lying flat causes distress."}[st.phase]),
  body:(st,c)=>{
   const who=c.conscious?"Alert, GCS 15, neck pain, distressed lying flat":"Unconscious, GCS 6";
   if(st.phase==="board") return rxHead(`${who}. On the stretcher: the combi-carrier?`)+`<div class="kit two"><button class="kitem" data-tx="smrb" data-v="keep"><img src="${RXM("combi")}" alt=""><span>Keep on the combi-carrier</span></button><button class="kitem" data-tx="smrb" data-v="off"><img src="${RXM("combi")}" alt="" style="opacity:.35;filter:grayscale(1)"><span>Remove the combi-carrier</span></button></div>`;
   if(st.phase==="blocks") return rxHead("Head blocks?")+`<div class="kit two"><button class="kitem" data-tx="smrh" data-v="1"><img src="${RXM("headblocks")}" alt=""><span>Apply head blocks</span></button><button class="kitem" data-tx="smrh" data-v="0"><img src="${RXM("headblocks")}" alt="" style="opacity:.35;filter:grayscale(1)"><span>Not needed now</span></button></div>`;
   if(st.phase==="secure") return rxHead("How do you secure the patient?")+rxOpts("smrs",c.conscious?["Stretcher straps","Spider harness only, no stretcher straps","Leave unsecured so she's comfortable"]:["Spider harness to the board, plus the stretcher straps","Stretcher straps only","Tape across the forehead only"]);
   return rxHead(c.conscious?"She's distressed lying flat. Set the stretcher backrest.":"Set the stretcher backrest.","Maintain SMR principles.")+`<div class="angw"><svg viewBox="0 0 240 120" aria-hidden="true"><path d="M20 100h200" class="ln"/><g transform="rotate(${-st.ang} 120 92)"><rect x="20" y="84" width="100" height="10" rx="4" class="bed"/></g><rect x="120" y="84" width="100" height="10" rx="4" class="bed"/></svg>
     <div class="stp" style="max-width:300px;margin:0 auto"><span class="label">Backrest angle</span><div><button class="iconbtn" data-tx="smra" data-d="-5" aria-label="Lower">−</button><output aria-live="polite">${st.ang}°</output><button class="iconbtn" data-tx="smra" data-d="5" aria-label="Raise">+</button></div></div></div>`;},
  foot:st=>st.phase==="angle"?`<button class="btn wide" data-tx="smrok">Confirm angle</button>`:""};

/* ====================== actions ====================== */
function rxClick(t,st){
  const a=t.dataset.tx,s=P.steps[P.i],c=rxCase(s),i=t.dataset.i!==undefined?+t.dataset.i:null;
  const pick=(ok,okMsg,next,badTitle,badWhy,outcome)=>ok?txOk(okMsg,{next}):txErr(badTitle,badWhy,outcome,{always:true});
  switch(a){
  case "noop": return true;
  case "rxkit": st.sel[t.dataset.id]=!st.sel[t.dataset.id];txSound("click");drawPlayer(`[data-id="${t.dataset.id}"]`);return true;
  case "rxkitok": rxKitCheck(st,st.tag==="nrkit"?NB_KIT:CC_KIT,st.tag==="nrkit"?"Infant BVM with a PEEP valve and oxygen, opened and ready. Also have a warm, dry place to resuscitate.":"Pads, adult BVM and oxygen go in with the monitor. Get the pads on as soon as possible.");return true;
  /* newborn */
  case "nrq": {
    const k=st.tag+":"+st.phase;
    if(k==="nrcord:cord") return pick(i===1,"Delayed clamping is for well babies. When urgent resuscitation is needed, clamp and cut now and move to a dry, warm area.","airway","Cord decision",i===0?"Waiting 60 seconds delays resuscitation. Don't delay clamping when resuscitation is needed.":"Resuscitate on a dry, warm, flat surface.","Ventilation would be delayed in an apnoeic baby."),true;
    if(k==="nrcord:airway") return pick(i===0,"Neutral position with a jaw thrust. Suction only for obstruction, under direct vision.","END","Airway",["","Hyperextension can obstruct a newborn's airway. Keep the head neutral.","Suction is only for obstruction seen under direct vision. Routine suction was removed.","Stimulate gently by drying or rubbing the soles or back. Never vigorously."][i]),true;
    if(k==="nrhr:decide"){const ok=c.hr<60?0:1;return pick(i===ok,c.hr<60?"HR below 60 after 30 seconds of ventilation: start compressions 3:1, two-thumb, 100% oxygen.":"HR 60–100: ventilation may need improving. Keep ventilating, check chest rise and reassess in 30 seconds.","END","Next step",c.hr<60?"HR is below 60 after 30 seconds of effective ventilation. That's the compression trigger.":i===0?"Compressions start only when HR stays below 60. This baby's HR is above that.":"HR under 100 means the baby still needs support. Keep ventilating.",c.hr<60?"Bradycardia would persist.":undefined),true;}
    if(k==="nrcomp:tech") return pick(i===0,"Two-thumb encircling technique. Now increase oxygen to 100% and deliver 3:1.","rhythm","Technique","For newborns and infants under 1 year, use the two-thumb encircling technique."),true;
    if(k==="nrmon:m1") return pick(i===0,"Breathing adequately with HR over 100: stop compressions and ventilations, and titrate oxygen down to the expected SpO₂.","m2","Reassessment",i===1?"HR is 130 and she's breathing. Compressions must stop.":"Oxygen is titrated to the expected SpO₂ for her age in minutes, not to 100%. At 3 minutes 70–75% is expected."),true;
    if(k==="nrmon:m2"){const ok=c.spo5>80?0:1;return pick(i===ok,ok===0?"On track: SpO₂ above 80% and HR above 100 by 5 minutes.":"Below 80% at 5 minutes should be avoided. Check the airway and ventilation and titrate oxygen up.","m3","Target check",ok===0?`SpO₂ ${c.spo5}% is above 80% at 5 minutes, which is on target.`:`SpO₂ ${c.spo5}% is below the 80% target for 5 minutes.`),true;}
    if(k==="nrmon:m3"){const low=c.temp<36.5,ok=low?1:0;return pick(i===ok,low?"Below 36.5 °C. Warm her: hat, dry wraps, a thermal mattress and plastic bag if preterm, a warm ambulance with doors closed.":"Within 36.5–37.5 °C. Keep her warm and keep checking.","END","Temperature",low?`${c.temp.toFixed(1)} °C is below the 36.5–37.5 °C target.`:i===1?`${c.temp.toFixed(1)} °C is already within the target. Maintain it.`:"Removing the wraps would cool her."),true;}
    if(k==="nrglu:treat") return pick(i===0,"RBS isn't low, so no dextrose. Prenotify the receiving obstetric unit: she's been resuscitated.","END","Glucose",i===1?"Dextrose is for hypoglycaemia. This RBS is not low.":"Glucagon should not be given to a newborn."),true;
    return true;}
  case "nrpeep": st.peep=Math.max(0,Math.min(20,st.peep+ +t.dataset.d));txSound("click");drawPlayer(`[data-tx="nrpeep"][data-d="${t.dataset.d}"]`);return true;
  case "nrfio": st.fio=+t.dataset.v;txSound("click");drawPlayer(`[data-tx="nrfio"][data-v="${t.dataset.v}"]`);return true;
  case "nrsetok": {const want=nbO2(c);
    if(st.peep!==6) return txErr(`PEEP ${st.peep} cmH₂O`,"PEEP for newborn ventilation is 6 cmH₂O.","Too little PEEP lets the lungs collapse between breaths; too much can over-distend them.",{always:true}),true;
    if(st.fio!==want) return txErr(`${st.fio}% oxygen at ${c.gest} weeks`,c.gest>=32?"At 32 weeks or more, start with room air (21%).":"Under 32 weeks, start with 30% oxygen.",undefined,{always:true}),true;
    txOk(`PEEP 6 cmH₂O and ${want===21?"room air (21%)":"30% oxygen"} for ${c.gest} weeks.`,{next:"END"});return true;}
  case "nrlisten": {if(st.listening)return true;st.listening=true;st.heard=true;const hb=document.getElementById("nrhb"),tm=document.getElementById("nrtime");const beats=Math.round(c.hr/10),gap=6000/beats;let n=0;const t0=Date.now();
    const iv=setInterval(()=>{if(P.sx!==st){clearInterval(iv);return;}const el=Date.now()-t0;if(tm)tm.textContent=`Listening… ${Math.max(0,6-el/1000).toFixed(1)} s`;},100);
    for(let b=0;b<beats;b++)setTimeout(()=>{if(P.sx!==st)return;n++;rxBeep(520,.09);if(hb){hb.classList.remove("on");void hb.offsetWidth;hb.classList.add("on");}},gap*b+gap/2);
    setTimeout(()=>{clearInterval(iv);st.listening=false;if(tm)tm.textContent="Done. Enter the heart rate.";},6050);return true;}
  case "nrhrok": {const v=+(document.getElementById("nrhrin")||{}).value;
    if(!st.heard) return txErr("Listen first","Listen for 6 seconds and count the beats before entering a heart rate.",undefined,{always:true}),true;
    if(!v||Math.abs(v-c.hr)>10) return txErr(`Heart rate ${v||"blank"}`,"Count the beats in 6 seconds and multiply by 10. Listen again if needed.",undefined,{always:true}),true;
    txOk(`Heart rate ${c.hr}/min.`,{next:"decide"});return true;}
  case "nrc": {const want=st.seq.length<3?"c":"b";
    if(t.dataset.v!==want){st.seq=[];st.cnote=want==="c"?"Out of sequence: three compressions first. Start the cycle again.":"After three compressions, give one breath. Start the cycle again.";txNote("Compression ratio out of sequence");txSound("err");drawPlayer(`[data-tx="nrc"][data-v="${t.dataset.v}"]`);return true;}
    st.seq.push(want);st.cnote="";txSound("click");if(st.seq.length===4){st.seq=[];st.cycles++;}
    if(st.cycles>=3) txOk("3:1 with the two-thumb technique and 100% oxygen. Reassess heart rate and breathing every 30 seconds.",{next:"END"});else drawPlayer(`[data-tx="nrc"][data-v="${t.dataset.v}"]`);return true;}
  case "nrskip": txOk("Keep ventilating effectively and reassess every 30 seconds. Compressions only if HR stays below 60.",{next:"END",quiet:true});return true;
  case "nrsite": if(t.dataset.ok==="1"){st.wrongId=null;txOk("Lateral heel. The RBS result is on the glucometer.",{next:"treat"});}else{st.wrongId=t.dataset.z;txErr(t.getAttribute("aria-label"),"Prick the lateral aspect of the heel.",undefined,{always:true});}return true;
  case "nrdexok": {const v=+(document.getElementById("nrdex")||{}).value,want=+(c.weight*2).toFixed(1);
    if(!v||Math.abs(v-want)>0.15) return txErr(`${v||"Blank"} ml`,`Dextrose 10% is 2 ml/kg: 2 × ${c.weight} kg = ${want} ml.`,v>want?"Too much glucose risks hyperglycaemia and fluid overload in a newborn.":undefined,{always:true}),true;
    txOk(`Dextrose 10% ${want} ml (2 ml/kg) IV/IO. Prenotify the obstetric unit: she's been resuscitated.`,{next:"END"});return true;}
  /* code clock */
  case "ccview": st.view=t.dataset.v;txSound("click");drawPlayer(`[data-tx="ccview"][data-v="${st.view}"]`);return true;
  case "ccpad": st.cur=t.dataset.p;txSound("click");drawPlayer(`[data-tx="ccpad"][data-p="${st.cur}"]`);return true;
  case "ccz": {const paed=c.pop==="paed"&&c.w<25,Z=paed?CC_PADZ.paed[st.view]:CC_PADZ.adult.front,z=Z.find(x=>x.id===t.dataset.z);
    if(!st.cur) return txErr("Pick a pad first","Select a pad on the right, then tap where it goes.",undefined,{always:true}),true;
    if(z.pad!==st.cur){st.wrongId=z.id;return txErr(`${z.label}`,paed?"Under 25 kg, anterior-posterior is first choice: one pad on the front of the chest, one on the back between the shoulder blades.":"Sternal pad below the right collarbone; apex pad on the left side in the mid-axillary line. Pads must not overlap.","Poor pad placement leads to ineffective defibrillation.",{always:true}),true;}
    st.placed[st.cur]=z.id;st.cur=null;st.wrongId=null;txSound("snap");
    if(Object.keys(st.placed).length===2) txOk(paed?"Anterior-posterior: first choice under 25 kg.":"Sternal and apex pads in position with good contact.",{next:"END"});else drawPlayer();return true;}
  case "ccstart": return pick(i===0,c.pop==="paed"?"Five ventilations, then 15:2.":"HOTT alongside compressions, minimum scene time.","check","Start",c.pop==="paed"?"Paediatric CPR starts with 5 ventilations, then 15:2.":"Trauma arrest: correct reversible causes alongside compressions. Adrenaline comes only after HOTT and volume."),true;
  case "cccheck": {const r=c.rh[st.cyc-1];
    if(r==="VF") return pick(i===0,"VF: shockable. Charge and shock.","defib","Rhythm check","This is VF, a shockable rhythm. Shock without delay.","Every minute without defibrillation in VF lowers survival."),true;
    if(i!==2) return txErr("Rhythm check","This is an organised rhythm. Check for a pulse.",undefined,{always:true}),true;
    if(r==="ROSC"){txOk("Pulse present: ROSC. Avoid rapid movement for up to 10 minutes, then move to post-ROSC care.",{next:"END"});return true;}
    st.given=[];st.phase="cpr";txLog(true,"PEA recognised");txSound("ok");drawPlayer();return true;}
  case "ccen": st.energy=Math.max(10,Math.min(200,st.energy+ +t.dataset.d));txSound("click");drawPlayer(`[data-tx="ccen"][data-d="${t.dataset.d}"]`);return true;
  case "ccenv": st.energy=+t.dataset.v;txSound("click");drawPlayer(`[data-tx="ccenv"][data-v="${t.dataset.v}"]`);return true;
  case "cccharge": {const want=ccEnergy(c,st.shocks);
    if(st.energy!==want) return txErr(`${st.energy} J`,c.pop==="paed"?`4 J/kg × ${c.w} kg = ${want} J.`:`${c.device}: ${CC_EN[c.device].join(", ")} J for shocks 1, 2 and 3 onwards. Shock ${st.shocks+1} is ${want} J.`,undefined,{always:true}),true;
    st.charged=true;txSound("alert");drawPlayer('[data-tx="ccshock"]');return true;}
  case "ccshock": st.shocks++;st.charged=false;st.given=[];txSound("snap");txLog(true,"Shock "+st.shocks);st.phase="cpr";drawPlayer();return true;
  case "cchott": {const k=t.dataset.k;st.hott=st.hott.includes(k)?st.hott.filter(x=>x!==k):[...st.hott,k];txSound("click");drawPlayer(`[data-tx="cchott"][data-k="${k}"]`);return true;}
  case "ccfluid": st.fluid+=250;st.log.push("NS 250 ml");txSound("click");drawPlayer('[data-tx="ccfluid"]');return true;
  case "ccadr": {const due=ccDue(c,st).includes("adr");
    if(c.pop==="paed"){const v=+(document.getElementById("ccadrin")||{}).value,want=Math.min(+(c.w*.01).toFixed(2),1);
      if(!due) return txErr("Adrenaline not due",st.lastAdr!=null?"Adrenaline repeats every 4 minutes (every second cycle).":"Shockable paediatric arrest: first adrenaline after 4 minutes of CPR.",undefined,{always:true}),true;
      if(Math.abs(v-want)>0.005) return txErr(`Adrenaline ${v||"blank"} mg`,`0.01 mg/kg × ${c.w} kg = ${want} mg (${(want*10).toFixed(1)} ml of 1:10,000).`,v>want?"A tenfold error with adrenaline in a child can cause dangerous arrhythmias.":undefined,{always:true}),true;
    } else if(!due){
      const why=c.pop==="trauma"?(st.hott.length<4||st.fluid<500?`Not yet: manage HOTT and give at least 500 ml normal saline first (${st.fluid} ml so far).`:"Adrenaline repeats every 4 minutes (every second cycle)."):st.lastAdr!=null?"Adrenaline repeats every 4 minutes (every second cycle).":"Adult medical shockable arrest: first adrenaline after the third shock.";
      return txErr("Adrenaline not due",why,c.pop==="trauma"&&st.fluid<500?"Adrenaline into an empty circulation won't restore output.":undefined,{always:true}),true;}
    st.given.push("adr");st.lastAdr=st.cyc;st.log.push(c.pop==="paed"?`Adr ${(c.w*.01).toFixed(2)} mg`:"Adr 1 mg");txLog(true,"Adrenaline cycle "+st.cyc);txSound("ok");drawPlayer();return true;}
  case "ccamio": {const d=ccDue(c,st),first=!st.amio1,want=c.pop==="paed"?Math.min(c.w*5,first?300:150):(first?300:150);
    const v=c.pop==="paed"?+(document.getElementById("ccamin")||{}).value:+t.dataset.v;
    if(!d.includes("amio1")&&!d.includes("amio2")) return txErr("Amiodarone not due",first?"First amiodarone is after the third shock.":st.amio2?"Both amiodarone doses have been given.":"The second amiodarone dose is after the fifth shock.",undefined,{always:true}),true;
    if(v!==want) return txErr(`Amiodarone ${v||"blank"} mg`,c.pop==="paed"?`5 mg/kg × ${c.w} kg = ${c.w*5} mg (max ${first?300:150} mg).`:first?"First dose after the third shock: 300 mg.":"Second dose after the fifth shock: 150 mg.",undefined,{always:true}),true;
    if(first){st.amio1=true;st.given.push("amio1");}else{st.amio2=true;st.given.push("amio2");}st.log.push(`Amio ${v} mg`);txLog(true,"Amiodarone "+v);txSound("ok");drawPlayer();return true;}
  case "cccont": {const d=ccDue(c,st);
    if(c.pop==="trauma"&&st.cyc===1&&(st.hott.length<4||st.fluid<500)) return txErr("HOTT not complete",`Work through all four HOTT causes and give at least 500 ml (${st.fluid} ml so far) during this cycle.`,"Uncorrected reversible causes mean CPR alone won't restore circulation.",{always:true}),true;
    if(d.length) return txErr("Drug due",`Due now: ${d.map(x=>({adr:"adrenaline",amio1:"amiodarone (first dose)",amio2:"amiodarone (second dose)"}[x])).join(" and ")}.`,undefined,{always:true}),true;
    st.cyc++;st.given=[];st.phase="check";txSound("click");drawPlayer();return true;}
  case "ccfi": {const S2=[0,1,2,3,4,5,6,7,9,12,15,25],k=S2.indexOf(st.fi)+ +t.dataset.d;if(k<0||k>=S2.length)return true;st.fi=S2[k];txSound("click");drawPlayer(`[data-tx="ccfi"][data-d="${t.dataset.d}"]`);return true;}
  case "ccspo": {const s2=st.spo;if(s2>=94&&s2<=98)txOk(`SpO₂ ${s2}%: within 94–98%. Avoid hyperoxaemia after ROSC.`,{next:"bp"});else txErr(`SpO₂ ${s2}%`,s2>98?"Too high. Titrate oxygen down to 94–98%; prolonged 100% is hyperoxaemia.":"Too low. Titrate oxygen up to 94–98%.",undefined,{always:true});return true;}

function txInfTimer(st,c){
